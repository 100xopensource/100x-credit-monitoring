<script>

window.PM = window.PM || {};
PM.views = PM.views || {};
(function () {
  'use strict';
  var F = PM.fmt;

  function colName(i) {                                  // 0 -> A, 26 -> AA
    var out = '';
    i += 1;
    while (i > 0) { var r = (i - 1) % 26; out = String.fromCharCode(65 + r) + out; i = Math.floor((i - 1) / 26); }
    return out;
  }


  function cellText(value, kind, dp) {
    if (value == null || value === '') return '';
    if (typeof value !== 'number') return F.esc(value);
    if (kind === 'pct') return F.pct(value, 1);
    if (kind === 'mult') return F.ratio(value);
    return value.toLocaleString('en-US',
      { minimumFractionDigits: dp || 0, maximumFractionDigits: dp || 0 });
  }


  function rowDecimals(cells) {
    var top = 0;
    for (var i = 1; i < cells.length; i++) {
      var v = cells[i];
      if (typeof v === 'number' && isFinite(v)) top = Math.max(top, Math.abs(v));
    }
    return top >= 100 ? 0 : (top >= 1 ? 2 : (top > 0 ? 3 : 0));
  }

  var NUM_W = 92, LBL_W = 260, RN_W = 46, MIN_W = 44;


  function headingRow(sheet) {
    var best = null;
    var rows = sheet.rows || [];
    for (var i = 0; i < rows.length; i++) {
      var cells = rows[i].c || [];
      var texts = 0, nums = 0;
      for (var c = 1; c < cells.length; c++) {
        if (typeof cells[c] === 'number') nums++;
        else if (typeof cells[c] === 'string' && cells[c]) texts++;
      }
      if (nums) break;                                   // the figures have started
      if (typeof cells[0] === 'string' && cells[0] && texts >= 2) best = rows[i];
    }
    return best;
  }

  function sheetTable(sheet, cellRef) {
    var target = String(cellRef || '').toUpperCase().split(':')[0];
    var hitRow = null, hitCol = null;
    var m = target.match(/^([A-Z]+)(\d+)$/);
    if (m) { hitCol = m[1]; hitRow = parseInt(m[2], 10); }

    var cols = sheet.cols || 0;

    var groups = '<col style="width:' + RN_W + 'px">';
    for (var g = 0; g < cols; g++) {
      groups += '<col style="width:' + (g === 0 ? LBL_W : NUM_W) + 'px">';
    }
    var headCells = '<th class="corner"><span class="sr">Row</span></th>';
    for (var c = 0; c < cols; c++) {
      headCells += '<th' + (c === 0 ? ' class="lblh"' : '') + ' data-c="' + c + '">' +
        colName(c) + '<span class="colgrab" data-grab="' + c + '"></span></th>';
    }

    var body = sheet.rows.map(function (row, ri) {
      var cells = row.c || [];
      var isHit = hitRow === row.r;
      var dp = rowDecimals(cells);
      var hasFigures = cells.slice(1).some(function (v) { return typeof v === 'number'; });
      var tds = '';
      for (var c = 0; c < cols; c++) {
        var raw = c < cells.length ? cells[c] : null;
        var classes = [];
        if (typeof raw === 'number') { classes.push('n'); if (raw < 0) classes.push('neg'); }
        if (c === 0) classes.push('lbl');
        if (isHit && hitCol && colName(c) === hitCol) classes.push('cellhit');
        var text = cellText(raw, row.k, dp);
        if (c === 0) {

          var long = typeof raw === 'string' && raw.length > 34;
          var title = long ? ' title="' + F.esc(raw) + '"' : '';
          text = '<div class="lblbox' + (long && !hasFigures ? ' wrap' : '') + '"' +
            title + '>' + text + '</div>';
        }
        tds += '<td' + (classes.length ? ' class="' + classes.join(' ') + '"' : '') + '>' + text + '</td>';
      }
      return '<tr data-r="' + ri + '"' + (isHit ? ' class="hit" id="xlrow-' + row.r + '"' : '') +
        '><th>' + row.r + '</th>' + tds + '</tr>';
    }).join('');


    return '<div class="sheet-scroll" tabindex="0" aria-label="' + F.esc(sheet.name) +
      ', a sheet of the model" aria-describedby="readout">' +
      '<table class="xl"><colgroup>' + groups + '</colgroup><thead><tr>' +
      headCells + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="readout" id="readout" role="status"><span class="hint">' +
      'Click a cell. Shift-click or hold Shift and use the arrows for a block, ' +
      'then Ctrl+C to copy it into Excel. Drag a column edge to widen it.</span></div>';
  }


  function cellPicker(host, sheet, wbName) {
    var scroll = host.querySelector('.sheet-scroll');
    var table = host.querySelector('table.xl');
    var out = host.querySelector('#readout');
    if (!scroll || !table) return;
    var tbody = table.tBodies[0], thead = table.tHead;
    var cols = sheet.cols || 0, nrows = (sheet.rows || []).length;
    var head = headingRow(sheet);
    var anchor = null, focus = null, marked = [];

    function td(r, c) {
      var tr = tbody.rows[r];
      return tr ? tr.cells[c + 1] : null;
    }
    function clear() {
      marked.forEach(function (el) { el.classList.remove('pick', 'anchor', 'axis'); });
      marked = [];
    }
    function rect() {
      return { r0: Math.min(anchor.r, focus.r), r1: Math.max(anchor.r, focus.r),
               c0: Math.min(anchor.c, focus.c), c1: Math.max(anchor.c, focus.c) };
    }
    function say() {
      var row = sheet.rows[focus.r] || {}, cells = row.c || [];
      var raw = focus.c < cells.length ? cells[focus.c] : null;
      var ref = colName(focus.c) + row.r;
      var label = typeof cells[0] === 'string' ? cells[0] : '';
      var under = head && head.c && typeof head.c[focus.c] === 'string' ? head.c[focus.c] : '';
      var box = rect(), n = (box.r1 - box.r0 + 1) * (box.c1 - box.c0 + 1);
      var value = raw == null || raw === ''
        ? '(empty)'
        : (typeof raw === 'number'
            ? raw.toLocaleString('en-US', { maximumFractionDigits: 6 })
            : String(raw));
      out.innerHTML =
        '<span class="ref">' + F.esc(wbName) + '!' + F.esc(ref) + '</span>' +
        (under ? '<span class="lab">' + F.esc(under) + '</span>' : '') +
        (label && focus.c !== 0 ? '<span class="lab">' + F.esc(label) + '</span>' : '') +
        '<span class="val">' + F.esc(value) + '</span>' +

        '<button class="btn sm" type="button" data-copy>Copy' +
          (n > 1 ? ' ' + n + ' cells' : ' this cell') + '</button>' +
        '<span class="hint">' + (n > 1 ? n + ' cells picked — Ctrl+C copies them'
                                       : 'Ctrl+C copies this cell') + '</span>';
    }
    function draw() {
      clear();
      var box = rect();
      for (var r = box.r0; r <= box.r1; r++) {
        for (var c = box.c0; c <= box.c1; c++) {
          var el = td(r, c);
          if (el) { el.classList.add('pick'); marked.push(el); }
        }
      }
      var f = td(focus.r, focus.c);
      if (f) { f.classList.add('anchor'); marked.push(f); }

      var ch = thead.rows[0].cells[focus.c + 1];
      if (ch) { ch.classList.add('axis'); marked.push(ch); }
      var rh = tbody.rows[focus.r] && tbody.rows[focus.r].cells[0];
      if (rh) { rh.classList.add('axis'); marked.push(rh); }
      say();
    }
    function pick(r, c, extend) {
      if (r < 0 || c < 0 || r >= nrows || c >= cols) return;
      focus = { r: r, c: c };
      if (!extend || !anchor) anchor = { r: r, c: c };
      draw();
    }
    function tsv() {
      var box = rect(), lines = [];
      for (var r = box.r0; r <= box.r1; r++) {
        var cells = (sheet.rows[r] || {}).c || [], bits = [];
        for (var c = box.c0; c <= box.c1; c++) {
          var v = c < cells.length ? cells[c] : null;

          bits.push(v == null ? '' : String(v).replace(/[\t\r\n]/g, ' '));
        }
        lines.push(bits.join('\t'));
      }
      return lines.join('\n');
    }
    function tell(message, good) {
      var hint = out.querySelector('.hint');
      if (!hint) return;
      var was = hint.textContent;
      hint.className = good ? 'hint copied' : 'hint';
      hint.textContent = message;
      setTimeout(function () { hint.className = 'hint'; hint.textContent = was; }, 2200);
    }

    function byCommand() {
      var ta = document.createElement('textarea');
      ta.value = tsv(); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      return ok;
    }
    function copySelection() {
      if (!focus) return;
      var text = tsv();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          function () { tell('Copied — paste it into Excel', true); },
          function () {
            tell(byCommand() ? 'Copied — paste it into Excel'
                             : 'This screen cannot copy — use Open the model in Excel',
                 true);
          });
        return;
      }
      tell(byCommand() ? 'Copied — paste it into Excel'
                       : 'This screen cannot copy — use Open the model in Excel', true);
    }
    out.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('[data-copy]')) copySelection();
    });

    scroll.addEventListener('mousedown', function (e) {
      var cell = e.target.closest && e.target.closest('td');
      if (!cell || e.target.closest('.colgrab')) return;
      var tr = cell.parentNode;
      pick(parseInt(tr.getAttribute('data-r'), 10), cell.cellIndex - 1, e.shiftKey);
      if (e.shiftKey) e.preventDefault();               // do not select the page text
      scroll.focus({ preventScroll: true });
    });


    var lit = [];
    function unlight() {
      lit.forEach(function (el) { el.classList.remove('hover', 'rule'); });
      lit = [];
    }
    scroll.addEventListener('mouseover', function (e) {
      var cell = e.target.closest && e.target.closest('td');
      unlight();
      if (!cell) return;
      var tr = cell.parentNode, c = cell.cellIndex - 1;
      cell.classList.add('hover'); tr.classList.add('hover'); lit.push(cell, tr);
      var ch = thead.rows[0].cells[c + 1];
      if (ch) { ch.classList.add('rule'); lit.push(ch); }
      if (tr.cells[0]) { tr.cells[0].classList.add('rule'); lit.push(tr.cells[0]); }
    });
    scroll.addEventListener('mouseleave', unlight);
    scroll.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
        if (!focus) return;
        copySelection();
        e.preventDefault();
        return;
      }
      var STEP = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
      var d = STEP[e.key];
      if (!d) return;
      if (!focus) { pick(0, 0, false); e.preventDefault(); return; }
      pick(focus.r + d[0], focus.c + d[1], e.shiftKey);
      var el = td(focus.r, focus.c);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      e.preventDefault();
    });


    var cg = table.querySelector('colgroup');
    function widthOf(c) { return parseInt(cg.children[c + 1].style.width, 10) || NUM_W; }
    function setWidth(c, px) { cg.children[c + 1].style.width = Math.max(MIN_W, Math.round(px)) + 'px'; }

    thead.addEventListener('pointerdown', function (e) {
      var grab = e.target.closest && e.target.closest('.colgrab');
      if (!grab) return;
      var c = parseInt(grab.getAttribute('data-grab'), 10);
      var from = e.clientX, was = widthOf(c);
      grab.classList.add('on');
      document.body.classList.add('resizing');
      grab.setPointerCapture(e.pointerId);
      function move(ev) { setWidth(c, was + (ev.clientX - from)); }

      function up() {
        grab.classList.remove('on');
        document.body.classList.remove('resizing');
        thead.removeEventListener('pointermove', move);
        thead.removeEventListener('pointerup', up);
        thead.removeEventListener('pointercancel', up);
        grab.removeEventListener('lostpointercapture', up);
      }
      thead.addEventListener('pointermove', move);
      thead.addEventListener('pointerup', up);
      thead.addEventListener('pointercancel', up);
      grab.addEventListener('lostpointercapture', up);
      e.preventDefault();
    });

    thead.addEventListener('dblclick', function (e) {
      var grab = e.target.closest && e.target.closest('.colgrab');
      if (!grab) return;
      var c = parseInt(grab.getAttribute('data-grab'), 10);
      var probe = document.createElement('canvas').getContext('2d');
      var cs = window.getComputedStyle(table);
      probe.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
      var widest = probe.measureText(colName(c)).width;
      (sheet.rows || []).forEach(function (row) {
        var cells = row.c || [], v = c < cells.length ? cells[c] : null;
        if (v == null || v === '') return;
        var shown = typeof v === 'number' ? cellText(v, row.k, rowDecimals(cells)) : String(v);
        widest = Math.max(widest, probe.measureText(shown).width);
      });
      setWidth(c, Math.min(widest + 26, 620));
      e.preventDefault();
    });

    return { pick: pick };
  }

  PM.views.workbook = function (host, wb, row, sheetName, cellRef, version) {
    var sheets = wb.sheets || [];
    if (!sheets.length) {
      host.innerHTML = '<div class="empty">' + F.esc(wb.note || 'This model has no readable sheets.') + '</div>';
      return;
    }
    var active = sheets.filter(function (s) { return s.name === sheetName; })[0] || sheets[0];
    var unit = wb.unit || row.unit;

    var bar = '<div class="wb-bar">' + PM.xlIcon() +
      '<span class="name">' + F.esc(wb.file_name || 'Financial model') + '</span>' +

      '<span class="unit">' + (unit && unit.plain
        ? 'in the file\'s own units: ' + F.esc(unit.plain) + ', rounded for reading' : '') +
        '</span>' +
      '</div>';

    var tabs = '<nav class="sheet-tabs" aria-label="Sheets in this model">' + sheets.map(function (s) {
      var to = '#/deal/' + F.esc(row.slug) + '/model/' + encodeURIComponent(s.name) +
        (version ? '?v=' + F.esc(version) : '');
      return '<a href="' + to + '" data-nav="' + to + '"' +
        (s.name === active.name ? ' aria-current="page"' : '') + '>' + F.esc(s.name) + '</a>';
    }).join('') + '</nav>';

    host.innerHTML = bar + tabs +
      (wb.note ? '<div class="body"><div class="note">' + F.esc(wb.note) + '</div></div>' : '') +
      sheetTable(active, active.name === (sheetName || active.name) ? cellRef : null);

    var picker = cellPicker(host, active, active.name);


    if (cellRef) {
      var cell = host.querySelector('td.cellhit');
      if (cell && cell.scrollIntoView) {
        cell.scrollIntoView({ block: 'center', inline: 'center' });

        if (picker) {
          picker.pick(parseInt(cell.parentNode.getAttribute('data-r'), 10),
                      cell.cellIndex - 1, false);
        }
      } else {
        var m = String(cellRef).toUpperCase().match(/^[A-Z]+(\d+)/);
        var anchor = m && document.getElementById('xlrow-' + m[1]);
        if (anchor && anchor.scrollIntoView) anchor.scrollIntoView({ block: 'center' });
      }
    }
  };
})();
</script>

<script>

window.PM = window.PM || {};
PM.boot = (function () {
  'use strict';
  var F = PM.fmt;

  var CAUSES = {
    'no-bridge': {
      title: 'This needs to be opened inside Claude',
      steps: ['Open it from the Claude app, under your artifacts.',
              'Opening the file straight from a browser cannot reach the folder on SharePoint.']
    },
    'root-not-found': {
      title: 'The monitoring folder could not be found',
      steps: ['In Claude, open Settings and then Connectors.',
              'Make sure Microsoft 365 is connected, and allow it when it asks.',
              'The folder this looks for is called Artifact, inside Monthly Monitor.',
              'Close this and open it again.']
    },
    'search-parse': {
      title: 'The folder search gave an answer this page could not read',
      steps: ['Close this and open it again.',
              'If it happens twice, tell the team — this is ours to fix, not yours.']
    },
    'rate-limit': {
      title: 'SharePoint asked us to slow down',
      steps: ['Wait about a minute and open it again. Nothing is broken and nothing was lost.']
    }
  };

  function selfCheck(e) {
    var kind = (e && e.kind) || 'unknown';
    var cause = CAUSES[kind] || {
      title: 'The monitoring book could not be opened',
      steps: ['Close this and open it again.',
              'If it happens twice, tell the team and mention what you were doing.']
    };
    document.getElementById('app').innerHTML =
      '<div class="selfcheck"><h2>' + F.esc(cause.title) + '</h2>' +
      '<p>Here is what usually fixes it:</p><ol>' +
      cause.steps.map(function (s) { return '<li>' + F.esc(s) + '</li>'; }).join('') +
      '</ol></div>';
  }

  function viewError(e) {
    document.getElementById('app').innerHTML =
      '<div class="selfcheck"><h2>That page could not be shown</h2><p>' +
      F.esc((e && e.message) || 'Something went wrong opening it.') +
      '</p><p><a class="btn" data-nav="#/" href="#/">Back to every deal</a></p></div>';
  }


  var TABNAME = { memo: 'Memo', covenants: 'Covenant tests', model: 'Financial model' };

  var lastBook = '#/';
  function crumbs(hash) {
    var box = document.getElementById('crumbs');
    if (!box) return;
    if (/^#\/(\?|$)/.test(hash)) lastBook = hash;
    var brand = document.querySelector('.top h1 a');
    if (brand) { brand.setAttribute('href', lastBook); brand.setAttribute('data-nav', lastBook); }
    var trail = [];
    var deal = hash.match(/^#\/deal\/([^/?]+)(?:\/([^/?]+))?(?:\/([^/?]+))?(?:\/([^/?]+))?/);
    if (/^#\/month\b/.test(hash)) {
      trail = [{ to: lastBook, text: 'Every deal' },
               { text: INDEX ? F.writeup(INDEX.period) : 'The write-up' }];
    } else if (/^#\/how\b/.test(hash)) {
      trail = [{ to: lastBook, text: 'Every deal' }, { text: 'How this works' }];
    } else if (deal) {
      var slug = decodeURIComponent(deal[1]);
      var tab = deal[2] || 'memo';
      trail = [{ to: lastBook, text: 'Every deal' },
               { to: '#/deal/' + deal[1], text: PM.boot.nameOf(slug) || slug }];
      if (tab !== 'memo') trail.push({ text: TABNAME[tab] || tab });
      if (tab === 'model' && deal[3]) {
        var sheet = decodeURIComponent(deal[3]);

        trail.push({ text: deal[4] ? sheet + '!' + decodeURIComponent(deal[4]) : sheet });
      }
    }
    box.innerHTML = trail.map(function (step, i) {
      var sep = i ? '<span class="sep" aria-hidden="true">›</span>' : '';
      return sep + (step.to
        ? '<a data-nav="' + step.to + '" href="' + step.to + '">' + F.esc(step.text) + '</a>'
        : '<span class="here">' + F.esc(step.text) + '</span>');
    }).join('');
    document.title = trail.length
      ? trail.map(function (s) { return s.text; }).join(' — ') + ' · Portfolio Monitor'
      : 'Portfolio Monitor';
  }


  function golinks(hash) {
    var box = document.getElementById('golinks');
    if (!box) return;
    var links = [];
    if (INDEX && INDEX.narrative) {
      links.push('<a class="golink" data-nav="#/month" href="#/month"' +
        (/^#\/month\b/.test(hash) ? ' aria-current="page"' : '') + '>' +
        F.esc(F.writeup(INDEX.period)) + '</a>');
    }
    links.push('<a class="golink how" data-nav="#/how" href="#/how"' +
      (/^#\/how\b/.test(hash) ? ' aria-current="page"' : '') + '>How this works</a>');
    box.innerHTML = links.join('');
  }


  var INDEX = null;
  function nameOf(slug) {
    if (!INDEX) return '';
    var hit = (INDEX.borrowers || []).filter(function (b) { return b.slug === slug; })[0];
    return hit ? hit.short : '';
  }


  function landed(hash) {
    var top = document.getElementById('viewtop');
    if (top && top.focus) top.focus({ preventScroll: true });
    PM.scroll.restore(hash);
  }

  // A deal route may end in ?v=draft or ?v=<period> to view that borrower's
  // draft preview or an earlier accepted period through the same reader --
  // an absent or unrecognised value falls back to the accepted result.
  function versionOf(query) {
    var m = /^v=(.+)$/.exec(query || '');
    return m ? m[1] : null;
  }

  function start() {
    PM.router.register(/^#\/(\?[^#]*)?$/, function (query) { PM.views.book(query); });
    PM.router.register(/^#\/month$/, function () { PM.views.month(); });
    PM.router.register(/^#\/how$/, function () { PM.views.how(); });
    PM.router.register(/^#\/deal\/([^/?]+)\/model\/([^/?]+)\/([^/?]+)(?:\?(.*))?$/, function (slug, sheet, cell, query) {
      PM.views.deal(slug, 'model', sheet, cell, versionOf(query));
    });
    PM.router.register(/^#\/deal\/([^/?]+)\/model\/([^/?]+)(?:\?(.*))?$/, function (slug, sheet, query) {
      PM.views.deal(slug, 'model', sheet, null, versionOf(query));
    });
    PM.router.register(/^#\/deal\/([^/?]+)\/([^/?]+)(?:\?(.*))?$/, function (slug, tab, query) {
      PM.views.deal(slug, tab, null, null, versionOf(query));
    });
    PM.router.register(/^#\/deal\/([^/?]+)(?:\?(.*))?$/, function (slug, query) {
      PM.views.deal(slug, 'memo', null, null, versionOf(query));
    });
    PM.router.onNavigate(function (hash) { crumbs(hash); golinks(hash); });

    golinks(location.hash || '#/');

    var waitingOut = null;
    PM.sched.onWaiting(function (state) {
      var box = document.getElementById('pm-waiting');
      if (!state) {
        if (box) {                                       // out the way it came in
          box.classList.remove('up');
          waitingOut = setTimeout(function () { if (box.parentNode) box.remove(); }, 220);
        }
        return;
      }

      if (waitingOut) { clearTimeout(waitingOut); waitingOut = null; }
      if (box) box.classList.add('up');
      if (!box) {
        box = document.createElement('div');
        box.id = 'pm-waiting';
        box.className = 'waiting';
        box.setAttribute('role', 'status');
        document.body.appendChild(box);
        requestAnimationFrame(function () { box.classList.add('up'); });
      }
      box.textContent = 'SharePoint asked us to slow down — picking up again in a moment.';
    });

    keepPlace();
    PM.data.onNews(function () { newBuild(); });


    PM.fonts.load();
    PM.data.index().then(function (ix) {
      INDEX = ix;
      document.getElementById('stamp').textContent =
        F.month(ix.period) + ' · built ' + String(ix.generated_at || '').slice(0, 10);
      lastPlace();
      crumbs(location.hash || '#/');
      golinks(location.hash || '#/');
      PM.router.dispatch();
    }, function (e) { selfCheck(e); });
  }


  var PLACE_HOURS = 12;

  function keepPlace() {
    var save = function () {
      var at = PM.router.at();
      if (at) PM.keep.putAt(at, window.scrollY || 0);
    };
    var timer = null;
    window.addEventListener('scroll', function () {
      if (timer) return;
      timer = setTimeout(function () { timer = null; save(); }, 400);
    }, { passive: true });
    PM.router.onNavigate(function () { save(); });

    document.addEventListener('visibilitychange', save);
    window.addEventListener('pagehide', save);
    window.addEventListener('beforeunload', save);
  }

  function lastPlace() {
    if ((location.hash || '#/') !== '#/') return;         // an address was given
    var kept = PM.keep.at();
    if (!kept || !kept.hash) return;
    if (!kept.t || (Date.now() - kept.t) > PLACE_HOURS * 3600000) return;

    PM.scroll.seed(kept.hash, kept.y);
    if (kept.hash === '#/') return;
    try { location.replace(location.pathname + location.search + kept.hash); }
    catch (e) { location.hash = kept.hash; }
  }


  function newBuild() {
    if (document.getElementById('pm-news')) return;
    var box = document.createElement('div');
    box.id = 'pm-news';
    box.className = 'waiting news';
    box.setAttribute('role', 'status');
    box.innerHTML = '<span>Newer results have landed.</span>' +
      '<button type="button" class="btn small" id="pm-news-go">Open them</button>' +
      '<button type="button" class="btn small quiet" id="pm-news-no">Not now</button>';
    document.body.appendChild(box);
    requestAnimationFrame(function () { box.classList.add('up'); });

    document.getElementById('pm-news-go').addEventListener('click', function () {
      PM.data.take();
      box.remove();
      PM.data.index().then(function (ix) {
        INDEX = ix;
        document.getElementById('stamp').textContent =
          F.month(ix.period) + ' · built ' + String(ix.generated_at || '').slice(0, 10);
        crumbs(PM.router.at());
        golinks(PM.router.at());
        PM.router.refresh();
      }, function (e) { selfCheck(e); });
    });
    document.getElementById('pm-news-no').addEventListener('click', function () {
      box.classList.remove('up');
      setTimeout(function () { if (box.parentNode) box.remove(); }, 220);
    });
  }

  return { start: start, selfCheck: selfCheck, viewError: viewError,
           landed: landed, nameOf: nameOf };
})();
PM.boot.start();
</script>
</body>
</html>
