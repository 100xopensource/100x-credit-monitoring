<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Monitor</title>
<script type="application/json" id="cowork-artifact-meta">
{
  "name": "Portfolio Monitor",
  "schemaVersion": 1,
  "description": "The monthly monitoring book: every borrower's covenants, performance and liquidity on one screen, with each deal's memo and financial model behind it."
}
</script>
<style>

:root{
  /* Portfolio Monitor palette -- canonical source: docs/theme/tokens.css.
     Indigo is identity; --green/--amber/--red are the original status trio and
     are 102 degrees or more off it, so a breach never reads as a button. The
     --xl family is Microsoft Excel's own brand and stays green on purpose. */
  --paper:#FFFFFF; --wash:#F4F3F8; --panel:#FFFFFF; --bg:#F6F6F6;

  --ink:#222222; --ink-2:#3A3A3A; --muted:#5C5C5C; --faint:#8A8A8A;

  --line:rgba(32,20,95,.11); --line-2:rgba(32,20,95,.18); --control-line:rgba(32,20,95,.34);
  --accent:#7B5CF5; --accent-ink:#5027F1;
  --accent-soft:#EDE9FB; --accent-bright:#9A82F7;
  --spot:#F4F3F8; --sel:#DAD2F9;

  --navy:#170B41; --dark-1:#100830; --dark-2:#170B41; --dark-3:#231363;
  --dark-ink:#FAF6F5; --dark-ink-2:#CDC6DE;
  --dark-ink-3:#B9AFCE; --dark-ink-4:#A49BBE;

  --green:#1f7a4d; --greenbg:#e9f3ed; --amber:#8a5d09; --amberbg:#f8efdc;
  --red:#b23a2c; --redbg:#f8e9e6;
  --xl:#217346; --xlbg:#e8f3ed; --xl-line:#c6e0d2;
  --xl-hover:#dcefe4; --xl-hover-line:#a9d2bd;
  --excel:var(--xl); --excelbg:var(--xlbg);

  --redbg-faint:#fdf7f6; --redbg-faint-2:#fbefed;
  --shadow:0 1px 2px rgba(32,20,95,.06),0 1px 1px rgba(32,20,95,.04);
  --shadow-pop:0 10px 30px rgba(32,20,95,.16),0 2px 6px rgba(32,20,95,.10);

  --radius:7px; --radius-ctl:5px; --radius-sm:3px;

  --t-xs:11px; --t-sm:12px; --t-md:13px; --t-base:14px; --t-lg:16px; --t-xl:19px;

  --t-2xl:26px; --t-3xl:30px;

  --t-read:15px; --t-lede:17px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;

  --stick:70px;

  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
}


@keyframes rise{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}
@keyframes fade{from{opacity:0} to{opacity:1}}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(92,92,92,.34)}
  70%{box-shadow:0 0 0 6px rgba(92,92,92,0)}
  100%{box-shadow:0 0 0 0 rgba(92,92,92,0)}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation:none !important;
    transition-property:opacity,background-color,color,border-color !important;
    transition-duration:.1s !important;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}

:root{
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
body{
  background:var(--bg); color:var(--ink);
  font:var(--t-base)/1.5 var(--sans);
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink)}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.01em}

.top h1,.mhead h2,.month h3,.month p,.deal-head h2,.dcard h3,.invite .lede,
.selfcheck h2,.empty strong{font-family:var(--sans)}
.month p{font-feature-settings:"onum" 0}

.tnum{font-variant-numeric:tabular-nums lining-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}


.top{
  position:sticky; top:0; z-index:30; background:linear-gradient(150deg,var(--dark-1) 0%,var(--navy) 55%,var(--dark-3) 100%); color:var(--dark-ink);
  padding:var(--s3) var(--s5); display:flex; align-items:center; gap:var(--s3);
  box-shadow:0 1px 0 rgba(255,255,255,.06);
}
.top .brand{display:flex; flex-direction:column; gap:2px; line-height:1.15}
.top h1{font-size:var(--t-lg); letter-spacing:.01em; white-space:nowrap; margin:0}
.top h1 a{color:var(--dark-ink); text-decoration:none}
.top h1 a:hover{color:var(--dark-ink-2)}
.top .subtitle{
  margin:0; font-size:var(--t-xs); font-weight:500; letter-spacing:.02em;
  color:var(--dark-ink-3); white-space:nowrap;
}
.top .crumbs{
  font-size:var(--t-md); color:var(--dark-ink-2); display:flex; align-items:center;
  gap:var(--s2); min-width:0; overflow:hidden;
}
.top .crumbs .sep{color:rgba(255,255,255,.34)}
.top .crumbs a{color:var(--dark-ink); text-decoration:none; white-space:nowrap}
.top .crumbs a:hover{text-decoration:underline}
.top .crumbs .here{
  color:var(--dark-ink); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.top .spacer{flex:1; min-width:var(--s2)}

.top .stamp{font-size:var(--t-sm); color:var(--dark-ink-3); white-space:nowrap}
.top .golink{
  font-size:var(--t-md); color:var(--dark-ink); text-decoration:none; white-space:nowrap;
  border:1px solid rgba(255,255,255,.22); border-radius:999px; padding:var(--s1) var(--s3);
  transition:background .13s ease, border-color .13s ease;
}
.top .golink:hover{background:rgba(255,255,255,.10); border-color:rgba(255,255,255,.42)}
.top .golink[aria-current]{background:rgba(255,255,255,.16); border-color:transparent}
#golinks{display:flex; align-items:center; gap:var(--s2)}

@media (max-width:820px){
  .top .stamp,.top .golink,.top .subtitle{display:none}
  .top .golink.how{display:inline}
  .top .crumbs > *{display:none}
  .top .crumbs > a:first-child,.top .crumbs > .here:last-child{display:inline}
}
.wrap{max-width:1500px; margin:0 auto; padding:var(--s5)}



.card{
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden; overflow:clip;
  animation:rise .17s var(--ease-out) both;
}

.pane{animation:fade .15s var(--ease-out) both}
.card > header{
  padding:var(--s3) var(--s4); border-bottom:1px solid var(--line); display:flex;
  align-items:baseline; gap:var(--s3); background:var(--paper);
}
.card > header h2{font-size:var(--t-base); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2)}
.card > header .sub{font-size:var(--t-sm); color:var(--muted)}
.card .body{padding:var(--s4)}


.toolbar{
  display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap;
  padding:var(--s2) var(--s4) var(--s3); border-bottom:1px solid var(--line);
  background:var(--paper);
}
.search{position:relative; display:flex; align-items:center; flex:0 1 300px; min-width:236px}
.search input{
  width:100%; font:inherit; font-size:var(--t-md); color:var(--ink);
  padding:var(--s2) 28px var(--s2) 30px; border:1px solid var(--control-line);
  border-radius:var(--radius-ctl); background:var(--paper);
  transition:border-color .13s ease, box-shadow .13s ease;
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none; border-color:var(--accent-ink); box-shadow:0 0 0 3px var(--accent-soft)}
.search .mag{position:absolute; left:var(--s2); width:14px; height:14px; color:var(--muted); pointer-events:none}
.search .clear{
  position:absolute; right:var(--s1); border:0; background:transparent; cursor:pointer;
  color:var(--muted); font:inherit; font-size:var(--t-lg); line-height:1; padding:2px 5px;
  border-radius:var(--radius-sm);
}
.search .clear:hover{color:var(--ink); background:var(--wash)}

.search input:placeholder-shown + .clear{display:none}
.sorter select{
  appearance:none; font:inherit; font-size:var(--t-sm); font-weight:600; color:var(--ink-2);
  border:1px solid var(--control-line); background:var(--paper); border-radius:var(--radius-ctl);
  padding:6px 26px 6px var(--s3); cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 14px,calc(100% - 9px) 14px;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
}
.sorter select:hover{border-color:var(--muted)}
.btn.sm{padding:6px var(--s3); font-size:var(--t-sm)}
.shapes{display:flex; gap:2px; border:1px solid var(--control-line); border-radius:var(--radius-ctl); padding:2px}
.shapes button{
  appearance:none; font:inherit; font-size:var(--t-sm); font-weight:600; cursor:pointer;
  border:0; background:transparent; color:var(--muted); border-radius:var(--radius-sm);
  padding:5px var(--s3); transition:background .13s ease, color .13s ease;
}
.shapes button:hover{color:var(--ink)}
.shapes button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink)}
.toolbar .count{font-size:var(--t-sm); color:var(--muted); margin-left:auto; white-space:nowrap}


.band{
  display:grid; grid-template-columns:minmax(200px,auto) minmax(0,1fr);
  gap:var(--s3) var(--s5); align-items:end;
  padding:var(--s5) var(--s5) var(--s4); margin:0 0 var(--s4);
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  animation:rise .17s var(--ease-out) both;
}
.band .when h2{font-family:var(--sans); font-size:var(--t-2xl); letter-spacing:-.02em; line-height:1.1}
.band .when .sub{margin-top:5px; font-size:var(--t-sm); color:var(--muted)}
.band .tiles{display:flex; flex-wrap:wrap; gap:var(--s2); justify-content:flex-end}

.tile{
  appearance:none; cursor:pointer; text-align:left; font:inherit; min-width:106px;
  padding:7px var(--s3) 9px; border:1px solid var(--line-2);
  border-radius:var(--radius-ctl); background:var(--paper);
  transition:border-color .13s ease, background .13s ease, transform .1s var(--ease-out);
}
.tile .n{
  display:block; font-size:var(--t-2xl); font-weight:650; letter-spacing:-.02em; line-height:1.1;
  color:var(--ink); font-variant-numeric:tabular-nums lining-nums;
}
.tile .w{display:block; margin-top:3px; font-size:var(--t-sm); color:var(--muted)}
.tile:hover{border-color:var(--control-line)}
.tile:active{transform:translateY(1px)}
.tile[aria-pressed="true"]{border-color:var(--ink); background:var(--wash);
  box-shadow:inset 0 0 0 1px var(--ink)}
.tile[aria-disabled="true"]{opacity:.5; cursor:default}
.tile[aria-disabled="true"]:hover{border-color:var(--line-2)}
.tile[aria-disabled="true"]:active{transform:none}
.tile.bad .n{color:var(--red)}
.tile.warn .n{color:var(--amber)}
.tile.bad[aria-pressed="true"]{border-color:var(--red); background:var(--redbg);
  box-shadow:inset 0 0 0 1px var(--red)}
.tile.warn[aria-pressed="true"]{border-color:var(--amber); background:var(--amberbg);
  box-shadow:inset 0 0 0 1px var(--amber)}

.band .goes{
  grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr; gap:var(--s3);
  margin-top:var(--s1); padding-top:var(--s4); border-top:1px solid var(--line);
}
.band .goes.one{grid-template-columns:1fr}
.goslot{min-height:74px}
.gocard{
  display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:var(--s3);
  padding:var(--s3) var(--s4); border:1px solid var(--line-2); border-radius:var(--radius-ctl);
  background:var(--paper); text-decoration:none; color:inherit; height:100%;
  transition:border-color .13s ease, background .13s ease, box-shadow .13s ease;
}
.gocard:hover{border-color:var(--accent-ink); background:var(--accent-soft);
  box-shadow:0 2px 10px rgba(32,20,95,.08)}
.gocard .t{
  display:block; font-family:var(--sans); font-size:var(--t-lg); color:var(--ink);
  letter-spacing:-.01em;
}
.gocard .d{display:block; margin-top:3px; font-size:var(--t-md); color:var(--muted); line-height:1.45}
.gocard .go{
  font-size:var(--t-md); font-weight:600; color:var(--accent-ink); white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px;
}
.gocard .go .arw{transition:transform .14s var(--ease-out)}
.gocard:hover .go{color:var(--navy)}

@media (hover: hover) and (pointer: fine){
  .gocard:hover .go .arw{transform:translateX(3px)}
}
@media (max-width:900px){ .band .goes{grid-template-columns:1fr} }
@media (max-width:900px){
  .band{grid-template-columns:1fr}
  .band .tiles{justify-content:flex-start}
}


.mhead{
  padding:var(--s6) var(--s7) var(--s5); border-bottom:1px solid var(--line);
  background:var(--paper);
}
.mhead > *{max-width:1010px; margin-left:auto; margin-right:auto}
.mhead h2{font-size:var(--t-xl); letter-spacing:-.02em; color:var(--ink)}

.mhead .said{font-size:var(--t-sm); color:var(--muted); margin:6px auto 0}


.mhead.mwrite{padding:var(--s7) var(--s7) var(--s6)}
.mhead.mwrite > .in{
  max-width:1244px; margin:0 auto; display:grid;
  grid-template-columns:minmax(0,1fr) auto; gap:var(--s5) var(--s7); align-items:end;
}
.mhead.mwrite h2{font-size:var(--t-3xl); line-height:1.1}
.mhead.mwrite .said{font-size:var(--t-md); margin:var(--s2) 0 0; max-width:70ch}

.mstatwrap .cap{
  margin:0 0 var(--s2); font-size:var(--t-xs); text-transform:uppercase;
  letter-spacing:.08em; font-weight:600; color:var(--muted);
}
.mstats{display:grid; grid-template-columns:repeat(4,minmax(76px,auto)); gap:var(--s2)}
.mstat{
  padding:var(--s2) var(--s3); border:1px solid var(--line);
  border-radius:var(--radius-ctl); background:var(--paper);
}
.mstat .n{display:block; font-size:var(--t-2xl); line-height:1.05; letter-spacing:-.02em; color:var(--ink)}
.mstat .w{display:block; margin-top:3px; font-size:var(--t-sm); color:var(--muted); line-height:1.3}
.mstat.bad{border-color:#f0cfc9; background:var(--redbg-faint-2)}
.mstat.bad .n{color:var(--red)}
.mstat.warn{border-color:#e6d3a8; background:var(--amberbg)}
.mstat.warn .n{color:var(--amber)}
.mstat.zero .n{color:var(--muted)}

.mwrap{
  display:grid; grid-template-columns:196px minmax(0,1fr); gap:0 var(--s7);
  padding:var(--s6) var(--s7) var(--s7); max-width:1308px; margin:0 auto;
}
.month{min-width:0; counter-reset:sec}
.month section{
  display:grid; grid-template-columns:minmax(0,1fr) 288px;
  gap:var(--s6); align-items:start;
  padding:0 0 var(--s6); margin:0 0 var(--s6); border-bottom:1px solid var(--line);
  animation:rise .3s var(--ease-out) both;
}
.month section:nth-child(2){animation-delay:.06s}
.month section:nth-child(3){animation-delay:.12s}
.month section:nth-child(n+4){animation-delay:.18s}
.month .prose{max-width:64ch}

.month section.no-deals{grid-template-columns:minmax(0,1fr)}
.month section:last-child{margin-bottom:0; padding-bottom:0; border-bottom:0}
.month h3{
  font-size:var(--t-2xl); letter-spacing:-.02em; color:var(--ink);
  font-weight:650; margin:0 0 var(--s3); scroll-margin-top:80px; counter-increment:sec;
}

.month h3::before{
  content:counter(sec,decimal-leading-zero); display:block; margin:0 0 var(--s1);
  font-family:var(--sans); font-size:var(--t-sm); font-weight:600; letter-spacing:.06em;
  color:var(--accent-ink); font-variant-numeric:tabular-nums;
}
.month p{margin:0 0 var(--s3); font-size:var(--t-read); line-height:1.65; color:var(--ink-2)}
.month p:last-child{margin-bottom:0}

.month section:first-child .prose p:first-child{font-size:var(--t-lede); line-height:1.55; color:var(--ink)}


.month .named{display:flex; flex-direction:column; gap:6px; position:sticky; top:var(--stick); align-self:start}
.month .named .cap{
  font-size:var(--t-sm); color:var(--muted); font-weight:600; margin:0 0 2px; line-height:1.35;
}
.month .named a{
  display:grid; grid-template-columns:minmax(0,1fr) auto; gap:0 var(--s3);
  padding:10px var(--s3); background:var(--paper); text-decoration:none;
  color:inherit; border:1px solid var(--line); border-radius:var(--radius-ctl);
  transition:border-color .13s ease, background .13s ease, transform .13s var(--ease-out);
}
@media (hover: hover) and (pointer: fine){
  .month .named a:hover{background:var(--spot); border-color:var(--line-2); transform:translateY(-1px)}
}
.month .named .who{
  font-weight:650; color:var(--ink); font-size:var(--t-base);
  letter-spacing:-.01em; min-width:0; overflow-wrap:anywhere;
}
.month .named a:hover .who{color:var(--accent-ink)}
.month .named .pct{
  font-size:var(--t-lg); font-weight:650; color:var(--green); justify-self:end;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em; white-space:nowrap;
}
.month .named .pct.bad{color:var(--red)}
.month .named .pct.warn{color:var(--amber)}
.month .named .stat{grid-column:1/-1; font-size:var(--t-sm); color:var(--muted); line-height:1.4; margin-top:2px}
.month .named .stat.bad{color:var(--red); font-weight:600}
.month .named .of{grid-column:1/-1; font-size:var(--t-sm); color:var(--muted); line-height:1.4; margin-top:3px}


.monthend{
  display:grid; grid-template-columns:1fr 1fr; gap:var(--s3);
  margin:var(--s6) 0 0; padding:var(--s6) 0 0; border-top:1px solid var(--line);
}
@media (max-width:1080px){
  .mwrap{grid-template-columns:1fr; padding:var(--s5); gap:var(--s5)}
  .month section{grid-template-columns:1fr; gap:var(--s4)}
  .month .named{position:static; display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  .month .named .cap{grid-column:1/-1}
  .mhead{padding:var(--s5)}
  .mhead.mwrite > .in{grid-template-columns:1fr; align-items:start}
  .mstats{grid-template-columns:repeat(auto-fit,minmax(76px,1fr))}
  .monthend{grid-template-columns:1fr}
}


.howwrap{
  display:grid; grid-template-columns:212px minmax(0,1fr); gap:0 var(--s7);
  padding:var(--s6) var(--s7) var(--s7); max-width:1260px; margin:0 auto;
}

.howrail,.mrail{position:sticky; top:var(--stick); align-self:start; display:flex; flex-direction:column; gap:1px}
.howrail .cap,.mrail .cap{font-size:var(--t-sm); color:var(--muted); font-weight:600; margin:0 0 var(--s2) 13px}

.mhead.howhead{padding:var(--s7) var(--s7) var(--s6)}

.mhead.howhead > .in{max-width:1196px; margin:0 auto}
.mhead.howhead h2{font-size:var(--t-3xl)}
.mhead.howhead .said{font-size:var(--t-lede); line-height:1.5; color:var(--ink-2);
  max-width:76ch; margin:var(--s2) 0 0}
.howrail a,.mrail a{
  font-size:var(--t-md); color:var(--muted); text-decoration:none; line-height:1.35;
  padding:7px 11px; border-left:2px solid var(--line); border-radius:0 var(--radius-sm) var(--radius-sm) 0;
  transition:color .12s ease, background .12s ease, border-color .12s ease;
}
.howrail a:hover,.mrail a:hover{color:var(--ink); background:var(--wash)}
.howrail a[aria-current],.mrail a[aria-current]{color:var(--accent-ink); border-left-color:var(--accent-ink);
  background:var(--accent-soft); font-weight:600}

.howpage section{
  display:grid; grid-template-columns:minmax(0,64ch) minmax(0,340px);
  gap:var(--s3) var(--s6); align-items:start;
  padding:0 0 var(--s6); margin:0 0 var(--s6); border-bottom:1px solid var(--line);
}
.howpage section.solo{grid-template-columns:minmax(0,1fr)}
.howpage section:last-child{margin-bottom:0; padding-bottom:0; border-bottom:0}
.howpage h3{
  grid-column:1/-1; font-size:var(--t-xl); letter-spacing:-.02em; color:var(--ink);
  font-family:var(--sans); font-weight:650; margin:0; scroll-margin-top:80px;
}
.howpage p{max-width:66ch; margin:0 0 var(--s3); font-size:var(--t-read); line-height:1.65; color:var(--ink-2)}
.howpage p:last-child{margin-bottom:0}
.howpage p.lede{font-size:var(--t-lede); line-height:1.55; color:var(--ink)}
.howpage ul{max-width:66ch; margin:0 0 var(--s3); padding-left:var(--s4); list-style:disc}
.howpage li{font-size:var(--t-read); line-height:1.6; color:var(--ink-2); margin:0 0 var(--s2)}
.howpage li:last-child{margin-bottom:0}
.howpage li b,.howpage p b{color:var(--ink); font-weight:650}
.howpage a{color:var(--accent-ink); text-decoration:none; border-bottom:1px solid #E9E8EF}
.howpage a:hover{border-bottom-color:var(--accent-ink)}


.exhibit{
  background:var(--wash); border:1px solid var(--line); border-radius:var(--radius);
  padding:var(--s4); position:sticky; top:var(--stick);
}

.exhibit .cap{
  display:block; font-size:var(--t-sm); color:var(--muted); font-weight:600;
  line-height:1.4; margin:0 0 var(--s3);
}
.exhibit .foot{margin:var(--s3) 0 0; font-size:var(--t-sm); color:var(--muted); line-height:1.5; max-width:none}
.exhibit .demo{background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-ctl);
  padding:var(--s3)}
.howpage .words{min-width:0}

.exhibit .exrow{padding:0 0 var(--s3); margin:0 0 var(--s3); border-bottom:1px solid var(--line)}
.exhibit .exrow:last-child{padding:0; margin:0; border-bottom:0}

.legend p{display:grid; grid-template-columns:auto minmax(0,1fr); gap:var(--s3);
  align-items:start; margin:0 0 var(--s2); font-size:var(--t-sm); line-height:1.45;
  color:var(--ink-2); max-width:none}
.legend p:last-child{margin-bottom:0}
.legend .key{width:3px; height:30px; border-radius:2px; display:block; margin-top:2px}
.legend .key.ok{background:var(--green)}
.legend .key.warn{background:var(--amber)}
.legend .key.bad{background:var(--red)}
.legend .key.part{background:repeating-linear-gradient(180deg,var(--green) 0 6px,var(--muted) 6px 10px)}
.legend .key.flat{background:repeating-linear-gradient(180deg,var(--muted) 0 3px,transparent 3px 7px)}
.exhibit .exlabel{
  display:block; font-size:var(--t-xs); text-transform:uppercase; letter-spacing:.06em;
  color:var(--muted); font-weight:600; margin:0 0 5px;
}

.hdemo .picks{display:flex; flex-wrap:wrap; gap:5px; margin:0 0 var(--s3)}
.hdemo .picks button{
  appearance:none; font:inherit; font-size:var(--t-sm); font-weight:600; cursor:pointer;
  color:var(--muted); background:var(--paper); border:1px solid var(--control-line);
  border-radius:999px; padding:4px 11px;
  transition:background .13s ease, color .13s ease, border-color .13s ease, transform .1s var(--ease-out);
}
.hdemo .picks button:hover{color:var(--ink)}
.hdemo .picks button:active{transform:translateY(1px)}
.hdemo .picks button[aria-checked="true"]{background:var(--navy); border-color:var(--navy); color:var(--dark-ink)}
.hdemo .hr-track{min-width:0}

.hdemo .hr-fill{width:50%; transform:scaleX(0); transition:transform .3s var(--ease-in-out)}

.exval{border-bottom:1px dotted var(--muted)}
.hdemo .exval{transition:color .2s ease}

.flow{display:grid; gap:6px}
.flow .step{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-ctl);
  padding:9px var(--s3);
}
.flow .step b{display:block; color:var(--ink); font-size:var(--t-md); font-weight:650}
.flow .step span{display:block; margin-top:2px; font-size:var(--t-sm); color:var(--muted); line-height:1.45}
.flow .down{color:var(--line-2); text-align:center; font-size:var(--t-md); line-height:1}
@media (max-width:1180px){
  .howwrap{grid-template-columns:1fr; padding:var(--s5); gap:var(--s5)}
  .howrail{position:static; flex-direction:row; flex-wrap:wrap; gap:var(--s1)}
  .howrail .cap{display:none}
  .howrail a{border-left:0; border:1px solid var(--control-line); border-radius:999px; padding:5px var(--s3)}
  .howrail a[aria-current]{border-color:var(--accent-ink)}
  .howpage section{grid-template-columns:minmax(0,1fr)}
  .exhibit{position:static}
}

@media (max-width:1080px){
  .mrail{position:static; flex-direction:row; flex-wrap:wrap; gap:var(--s1)}
  .mrail .cap{display:none}
  .mrail a{border-left:0; border:1px solid var(--control-line); border-radius:999px; padding:5px var(--s3)}
  .mrail a[aria-current]{border-color:var(--accent-ink)}
}


.rowpills{margin:7px 0 0; display:flex; flex-wrap:wrap; gap:6px}
table.grid .rowpills{margin-top:5px; gap:5px}
table.grid .rowpills .chip{font-size:var(--t-xs); padding:2px 7px}


.grid-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}

table.grid{width:100%; min-width:1020px; border-collapse:collapse; table-layout:fixed}
table.grid th{
  text-align:left; font-size:var(--t-xs); text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); font-weight:600; padding:0; background:var(--wash);
  border-bottom:1px solid var(--line-2); white-space:nowrap;
}

table.grid th button{
  appearance:none; border:0; background:transparent; cursor:pointer; font:inherit;
  color:inherit; letter-spacing:inherit; text-transform:inherit; font-weight:inherit;
  padding:var(--s2) var(--s3); width:100%; text-align:inherit;
  display:flex; align-items:center; gap:5px; transition:color .12s ease;
}
table.grid th.num button{justify-content:flex-end}
table.grid th button:hover{color:var(--ink)}
table.grid th button .car{opacity:0; transition:opacity .12s ease; font-size:9px}
table.grid th button:hover .car{opacity:.5}
table.grid th[aria-sort] button{color:var(--accent-ink)}
table.grid th[aria-sort] button .car{opacity:1}
table.grid td{padding:var(--s3) var(--s3); border-bottom:1px solid var(--line); vertical-align:top}
table.grid tr:last-child td{border-bottom:0}

table.grid tbody tr{cursor:pointer; transition:background .1s ease}
table.grid tbody tr:hover{background:var(--spot)}

table.grid td:first-child{position:relative; padding-left:calc(var(--s3) + 5px)}
table.grid tbody tr > td:first-child::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--line-2);
}
table.grid tbody tr.r-ok > td:first-child::before{background:var(--green)}
table.grid tbody tr.r-warn > td:first-child::before{background:var(--amber)}
table.grid tbody tr.r-bad > td:first-child::before{background:var(--red)}

table.grid tbody tr.r-part > td:first-child::before{
  background:repeating-linear-gradient(180deg,var(--green) 0 6px,var(--muted) 6px 10px);
}

table.grid tbody tr.r-flat > td:first-child::before{
  background:repeating-linear-gradient(180deg,var(--muted) 0 3px,transparent 3px 7px);
}
table.grid tbody tr.r-bad{background:var(--redbg-faint)}
table.grid tbody tr.r-bad:hover{background:var(--redbg-faint-2)}
table.grid th.num,table.grid td.num{text-align:right; font-variant-numeric:tabular-nums}

table.grid th:nth-child(5),table.grid td:nth-child(5){border-left:1px solid var(--line)}

table.grid th:nth-child(1){width:25%}
table.grid th:nth-child(2){width:9%}
table.grid th:nth-child(3){width:13%}
table.grid th:nth-child(4){width:17%}
table.grid th:nth-child(5),table.grid th:nth-child(6),table.grid th:nth-child(7){width:12%}

.deal-name{
  font-weight:650; color:var(--ink); font-size:var(--t-base); text-decoration:none;
  display:inline-block;
}
.deal-name:hover{color:var(--accent-ink); text-decoration:underline}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

[tabindex="-1"]:focus{outline:none}
.deal-sub{
  font-size:var(--t-sm); color:var(--muted); margin-top:2px; max-width:34ch;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.period{font-weight:600; font-size:var(--t-md); white-space:nowrap}
.basis{font-size:var(--t-xs); color:var(--muted); margin-top:2px; white-space:nowrap}

.period.stale{color:var(--amber)}
.basis.stale{color:var(--amber); font-weight:600}

mark{background:#fdf0c3; color:inherit; border-radius:2px; padding:0 1px}


.cards{

}

.dcard{display:flex; flex-direction:column}
.dcard{

}

.dcard.bad{border-top-color:var(--red)}
.dcard.flat{border-top-color:var(--line-2)}
.dcard h3{font-size:var(--t-lg); letter-spacing:-.01em; color:var(--ink)}
.dcard:hover h3{color:var(--accent-ink)}
.dcard .sub{

  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.dcard .top-line{display:flex; align-items:baseline; gap:var(--s2); justify-content:space-between}
.dcard .when{font-size:var(--t-sm); color:var(--muted); white-space:nowrap}
.dcard .hr{margin:var(--s3) 0 0}
.dcard .figs{
  display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2);

}

}
.dcard .figs .fig .v{font-size:var(--t-base)}

.dcard .figs .fig .d{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dcard .figs .sparkslot{justify-content:flex-start}
.dcard .standings{display:flex; flex-wrap:wrap; gap:var(--s2); align-items:flex-start}
.dcard .note{margin:var(--s3) 0 0}


.chip{
  display:inline-block; padding:3px 9px; border-radius:999px; font-size:var(--t-sm);
  font-weight:600; letter-spacing:.01em; white-space:nowrap; border:1px solid transparent;
}
.chip.ok{background:var(--greenbg); color:var(--green)}
.chip.warn{background:var(--amberbg); color:var(--amber)}
.chip.bad{background:var(--redbg); color:var(--red)}
.chip.flat{background:var(--wash); color:var(--muted); border-color:var(--line-2)}
.chip.view{background:var(--accent-soft); color:var(--accent-ink)}

.chip.wrap{white-space:normal; max-width:60ch}

.chips{display:flex; flex-direction:column; align-items:flex-start; gap:6px}


.hr-val{font-weight:650; font-size:var(--t-xl); letter-spacing:-.02em}
.hr-val.bad{color:var(--red)} .hr-val.warn{color:var(--amber)} .hr-val.ok{color:var(--green)}
.hr-track{
  position:relative; height:9px; border-radius:5px; background:var(--wash);
  border:1px solid var(--line); margin:5px 0 4px; overflow:hidden; min-width:110px;
}

.hr-zero{position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--muted); opacity:.5; z-index:2}

.hr-track.capped::after{
  content:''; position:absolute; top:0; bottom:0; right:0; width:5px; z-index:3;
  background:repeating-linear-gradient(135deg,var(--paper) 0 2px,transparent 2px 4px);
}
.hr-track.capped.neg::after{right:auto; left:0}
.hr-fill{position:absolute; top:0; bottom:0}
.hr-fill.ok{background:linear-gradient(90deg,#2BAB6C,var(--green)); left:50%; transform-origin:left center}
.hr-fill.warn{background:linear-gradient(90deg,#C8870D,var(--amber)); left:50%; transform-origin:left center}
.hr-fill.bad{background:linear-gradient(270deg,#D05041,var(--red)); right:50%; transform-origin:right center}

.hr-name{

  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.hr-head{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap}

.hr-word{

}
.grid thead th,table.cov thead th{vertical-align:top}

  background:var(--navy); color:var(--dark-ink); font-size:var(--t-sm); line-height:1.5;

}

.readpanel p:last-child{margin-bottom:0}


.sheet-tabs{
  display:flex; gap:0; padding:0 14px; background:var(--wash);
  border-bottom:1px solid var(--line-2); overflow-x:auto;
}
.sheet-tabs a{
  appearance:none; border:1px solid transparent; border-bottom:0; background:transparent;
  padding:8px 15px; cursor:pointer; font:inherit; font-size:var(--t-sm); font-weight:600;
  color:var(--muted); white-space:nowrap; margin-top:5px; text-decoration:none;
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
}
.sheet-tabs a{transition:background .12s ease, color .12s ease, transform .11s var(--ease-out)}
.sheet-tabs a:hover{color:var(--ink)}

  background:var(--paper); color:var(--excel); border-color:var(--line-2);
  box-shadow:0 -2px 0 var(--excel) inset;
}
.sheet-scroll{
  overflow:auto; max-height:calc(100vh - 300px); background:var(--paper);
  animation:fade .16s var(--ease-out) both;
}

table.xl{
  border-collapse:separate; border-spacing:0; font-size:var(--t-sm);
  table-layout:fixed; width:max-content;
}

  border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:5px 9px; white-space:nowrap; background:var(--paper);
  overflow:hidden; text-overflow:ellipsis;
}
table.xl thead th{
  position:sticky; top:0; z-index:3; background:var(--wash); color:var(--muted);
  font-weight:600; font-size:var(--t-xs); text-align:center; user-select:none;
}

table.xl tbody th{
  position:sticky; left:0; z-index:2; background:var(--wash); color:var(--muted);
  font-weight:500; font-size:var(--t-xs); text-align:right;
  padding:5px 7px; user-select:none;
}
table.xl thead th.corner{position:sticky; left:0; z-index:4}

table.xl td.lbl,table.xl thead th.lblh{
  position:sticky; left:46px; z-index:2; font-weight:600; color:var(--ink);
  text-align:left;
}
table.xl thead th.lblh{z-index:4}
table.xl td.lbl .lblbox{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

table.xl td.lbl .lblbox.wrap{
  white-space:normal; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
}
table.xl td.n{text-align:right; font-variant-numeric:tabular-nums lining-nums}
table.xl td.neg{color:var(--red)}
table.xl tr.hit td,table.xl tr.hit th{background:var(--sel)}

table.xl td.cellhit{
  outline:2px solid var(--accent); outline-offset:-2px; background:var(--sel);
  animation:pulse 1s var(--ease-out) 2;
}



.sheet-scroll:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}

table.xl tbody tr.hover > td{background:var(--spot)}
table.xl td.hover{background:var(--sel)}
table.xl th.rule{background:var(--accent-soft); color:var(--accent-ink)}
table.xl td.pick{background:var(--sel)}
table.xl td.anchor{
  outline:2px solid var(--accent); outline-offset:-2px; position:relative; z-index:1;
}

table.xl thead th.axis,table.xl tbody th.axis{background:var(--accent-soft); color:var(--accent-ink)}

.colgrab{
  position:absolute; top:0; right:0; width:8px; height:100%; cursor:col-resize;
  z-index:5; touch-action:none;
}
.colgrab:hover,.colgrab.on{background:var(--accent); opacity:.55}
body.resizing{cursor:col-resize; user-select:none}

.readout{

<script>

window.PM = window.PM || {};
PM.sched = (function () {
  'use strict';
  var cfg = { windowMs: 60000, maxPerWindow: 25, timeoutMs: 70000 };
  var BACKOFF = [15000, 30000, 60000], MAX_TRIES = 10;
  var stamps = [], queue = [], pending = new Map(), listeners = [];
  var pausedUntil = 0, timer = null;

  function isRateLimit(e) {
    return /rate limit exceeded/i.test(String((e && e.message) || e || ''));
  }
  function notify() {
    var state = pausedUntil > Date.now() ? { until: pausedUntil } : null;
    listeners.forEach(function (fn) { try { fn(state); } catch (e) {} });
  }
  function schedule(ms) {
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { timer = null; drain(); }, Math.max(ms, 0));
  }
  function drain() {
    var now = Date.now();
    if (pausedUntil > now) { schedule(pausedUntil - now); return; }
    if (pausedUntil) { pausedUntil = 0; notify(); }
    while (queue.length) {
      now = Date.now();
      while (stamps.length && stamps[0] <= now - cfg.windowMs) stamps.shift();
      if (stamps.length >= cfg.maxPerWindow) { schedule(stamps[0] + cfg.windowMs - now); return; }
      stamps.push(now);
      dispatch(queue.shift());
    }
  }
  function dispatch(item) {
    var timedOut = new Promise(function (_, rej) {
      setTimeout(function () { rej(new Error('call timed out')); }, cfg.timeoutMs);
    });
    Promise.race([Promise.resolve().then(item.fn), timedOut]).then(item.resolve, function (e) {
      if (isRateLimit(e) && item.tries < MAX_TRIES) {
        var wait = BACKOFF[Math.min(item.tries, BACKOFF.length - 1)];
        item.tries += 1;
        // never shorten a longer pause another call already set
        var until = Date.now() + wait;
        if (until > pausedUntil) pausedUntil = until;
        queue.unshift(item);
        notify();
        schedule(pausedUntil - Date.now());
        return;
      }
      if (isRateLimit(e)) e.kind = 'rate-limit';
      item.reject(e);
    }).finally(function () { drain(); });
  }
  function call(key, fn) {
    if (pending.has(key)) return pending.get(key);
    var p = new Promise(function (resolve, reject) {
      queue.push({ key: key, fn: fn, resolve: resolve, reject: reject, tries: 0 });
      drain();
    });
    var wrapped = p.finally(function () { pending.delete(key); });
    pending.set(key, wrapped);
    return wrapped;
  }
  return { call: call, onWaiting: function (fn) { listeners.push(fn); }, isRateLimit: isRateLimit };
})();
</script>

<script>
/* HOSTED_SOURCE_BEGIN */

window.PM = window.PM || {};
PM.uri = (function () {
  'use strict';
  // The connector server is injected when a hosted artifact is created.
  var SERVER = '';
  var T_READ = 'mcp__' + SERVER + '__read_resource';
  var T_SEARCH = 'mcp__' + SERVER + '__sharepoint_folder_search';
  var ROOT_NAME = 'Artifact';
  var INDEX_SCHEMA = 'credit-monitor-artifact-index/v1';


  var PINNED_ROOT_URI = '';

  var listing = null;    // name(lowercase) -> uri
  var rootUri = null;
  var stash = null;      // {name, text} — validation already read index.json

  function err(kind, message) { var e = new Error(message); e.kind = kind; return e; }

  function texts(r) {
    if (!r) return [];
    if (Array.isArray(r.content)) {
      return r.content.filter(function (c) { return c && typeof c.text === 'string'; })
        .map(function (c) { return c.text; });
    }
    if (typeof r.content === 'string') return [r.content];
    return [];
  }
  function extractText(r) {
    var sc = r && r.structuredContent;
    if (sc && typeof sc.content === 'string') return sc.content;
    return texts(r).join('\n');
  }
  function mcp(tool, args) {
    return PM.sched.call(tool + '|' + JSON.stringify(args), function () {
      if (!(window.cowork && typeof window.cowork.callMcpTool === 'function')) {
        throw err('no-bridge', 'no cowork bridge');
      }
      return window.cowork.callMcpTool(tool, args).then(function (r) {
        if (r && r.isError) throw new Error('mcp-error: ' + texts(r).join('\n').slice(0, 300));
        return r;
      });
    });
  }


  function parseListing(r) {
    var out = [];
    var sc = r && r.structuredContent;
    if (sc && Array.isArray(sc.items)) {
      sc.items.forEach(function (it) {
        if (it && it.uri) out.push({ name: it.name, type: it.type || 'file', uri: it.uri });
      });
      if (out.length) return out;
    }
    texts(r).forEach(function (t) {
      t.split('\n').forEach(function (raw) {
        var m = raw.trim().match(/^(.*?)\s+\((file|folder),\s*([\d,]+)\s*bytes?\)\s+(file:\/\/\/\S+)\s*$/i);
        if (m) out.push({ name: m[1], type: m[2].toLowerCase(), uri: m[4] });
      });
    });
    return out;
  }

  function indexFrom(items) {
    var map = Object.create(null);
    items.forEach(function (i) { if (i.type === 'file') map[i.name.toLowerCase()] = i.uri; });
    return map;
  }

  function validate(uri) {
    return mcp(T_READ, { uri: uri }).then(function (r) {
      var items = parseListing(r);
      var map = indexFrom(items);
      if (!map['index.json']) return null;
      return mcp(T_READ, { uri: map['index.json'] }).then(function (rr) {
        var text = extractText(rr), parsed = null;
        try { parsed = JSON.parse(text); } catch (e) { return null; }
        if (!parsed || parsed.schema !== INDEX_SCHEMA) return null;
        stash = { name: 'index.json', text: text };
        return { uri: uri, map: map };
      });
    });
  }


  var SEARCH_LIMIT = 50;    // the tool's maximum per request
  var SEARCH_PAGES = 4;     // 200 results before giving up

  function searchPage(offset) {
    return mcp(T_SEARCH, { name: ROOT_NAME, limit: SEARCH_LIMIT, offset: offset }).then(function (r) {
      var uris = [], parsed = 0, sawText = false, next = null;
      texts(r).forEach(function (t) {
        if (t && t.trim()) sawText = true;
        var p = null;
        try { p = JSON.parse(t); } catch (e) { return; }
        (Array.isArray(p) ? p : [p]).forEach(function (c) {
          if (!c) return;
          if (typeof c.nextOffset === 'number') { next = c.nextOffset; return; }
          parsed++;
          if (c.uri && c.name === ROOT_NAME) uris.push(c.uri);
        });
      });
      return { uris: uris, parsed: parsed, sawText: sawText, next: next };
    });
  }

  function searchRoot() {
    var pages = 0, parsedAny = false, sawAnyText = false, lastErr = null;
    function done() {
      if (lastErr && lastErr.kind) throw lastErr;
      if (!parsedAny && sawAnyText) throw err('search-parse', 'the folder search returned an unreadable result');
      throw err('root-not-found', 'no folder named "' + ROOT_NAME + '" holds the monitoring book');
    }
    function page(offset) {
      pages++;
      return searchPage(offset).then(function (res) {
        if (res.parsed) parsedAny = true;
        if (res.sawText) sawAnyText = true;
        var i = 0;
        function next() {
          if (i >= res.uris.length) {
            if (res.next === null || pages >= SEARCH_PAGES) return done();
            return page(res.next);
          }
          return validate(res.uris[i++]).then(function (hit) {
            if (!hit) return next();
            return adopt(hit);
          }, function (e) {
            if (PM.sched.isRateLimit(e)) throw e;
            lastErr = e;
            return next();
          });
        }
        return next();
      }, function (e) {
        // A later page failing is not a dead connector — the first page
        // already answered. Settle with what the earlier pages gave.
        if (PM.sched.isRateLimit(e) || offset === 0) throw e;
        return done();
      });
    }
    return page(0);
  }


  function adopt(hit) {
    rootUri = hit.uri; listing = hit.map;
    if (PM.keep) PM.keep.putRoot(hit.uri, hit.map);
    return hit;
  }

  function resolveRoot(skipPinned) {
    if (listing && rootUri) return Promise.resolve({ uri: rootUri, map: listing });

    var kept = (!skipPinned && PM.keep) ? PM.keep.root() : null;
    if (kept) {
      rootUri = kept.uri; listing = kept.map;
      return Promise.resolve({ uri: rootUri, map: listing });
    }
    if (PINNED_ROOT_URI && !skipPinned) {
      return validate(PINNED_ROOT_URI).then(function (hit) {
        if (!hit) return resolveRoot(true);
        return adopt(hit);
      }, function (e) {
        if (PM.sched.isRateLimit(e)) throw e;
        return resolveRoot(true);
      });
    }
    return searchRoot();
  }

  function relist() {
    listing = null;
    if (PM.keep) PM.keep.forgetRoot();
    return resolveRoot(false);
  }


  function readText(name) {
    if (stash && stash.name.toLowerCase() === name.toLowerCase()) {
      var text = stash.text; stash = null;
      return Promise.resolve(text);
    }
    return resolveRoot(false).then(function (root) {
      var uri = root.map[name.toLowerCase()];
      if (!uri) {
        return relist().then(function (fresh) {
          var again = fresh.map[name.toLowerCase()];
          if (!again) throw err('unavailable', 'the book names this file but the folder does not hold it: ' + name);
          return mcp(T_READ, { uri: again }).then(extractText);
        });
      }
      return mcp(T_READ, { uri: uri }).then(extractText, function (e) {
        if (PM.sched.isRateLimit(e)) throw e;
        return relist().then(function (fresh) {
          var again = fresh.map[name.toLowerCase()];
          if (!again) throw err('unavailable', 'the book names this file but the folder does not hold it: ' + name);
          return mcp(T_READ, { uri: again }).then(extractText);
        });
      });
    });
  }

  function readJson(name) {
    return readText(name).then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw err('unreadable', 'this page of the book is not readable: ' + name); }
    });
  }

  return { readText: readText, readJson: readJson, resolveRoot: resolveRoot, parseListing: parseListing };
})();
</script>

<script>

window.PM = window.PM || {};
PM.http = {
  readText: function (name) {
    return fetch(encodeURIComponent(name), { cache: 'no-store' }).then(function (r) {
      if (!r.ok) { var e = new Error('http ' + r.status + ' for ' + name); e.kind = 'unavailable'; throw e; }
      return r.text();
    });
  },
  readJson: function (name) { return PM.http.readText(name).then(JSON.parse); }
};

PM.source = function () {
  if (window.cowork && typeof window.cowork.callMcpTool === 'function') return PM.uri;
  if (location.protocol === 'http:' || location.protocol === 'https:') return PM.http;
  return PM.uri;                                        // reports 'no-bridge' honestly
};
/* HOSTED_SOURCE_END */


window.PM = window.PM || {};
PM.keep = (function () {
  'use strict';
  var PFX = 'credit-monitor.dashboard.';
  var MAX_TEXT = 600000;     // a page larger than this is held in memory only

  var MAX_PAGES = 6;

  function store() {
    try { return window.localStorage || null; } catch (e) { return null; }   // storage off
  }
  function get(key) {
    var s = store();
    try { return s ? s.getItem(PFX + key) : null; } catch (e) { return null; }
  }
  function drop(key) {
    var s = store();
    if (s) { try { s.removeItem(PFX + key); } catch (e) {} }
  }
  function ours() {
    var s = store(), out = [];
    if (!s) return out;
    try {
      for (var i = 0; i < s.length; i++) {
        var k = s.key(i);
        if (k && k.indexOf(PFX) === 0) out.push(k.slice(PFX.length));
      }
    } catch (e) {}
    return out;
  }

  function put(key, text) {
    var s = store();
    if (!s || text == null || String(text).length > MAX_TEXT) return false;
    try { s.setItem(PFX + key, text); return true; }
    catch (e) {
      ours().forEach(function (k) { if (k.indexOf('p:') === 0) drop(k); });
      try { s.setItem(PFX + key, text); return true; } catch (e2) { return false; }
    }
  }

  function sweep(stamp) {
    var pages = [];
    ours().forEach(function (k) {
      if (k.indexOf('p:') !== 0) return;
      if (k.indexOf('p:' + stamp + ':') !== 0) { drop(k); return; }
      pages.push(k);
    });
    while (pages.length > MAX_PAGES) drop(pages.shift());
  }

  return {
    index: function () {
      var text = get('ix');
      if (!text) return null;
      try {
        var parsed = JSON.parse(text);
        if (!parsed || !parsed.generated_at) return null;
        return { text: text, parsed: parsed };
      } catch (e) { drop('ix'); return null; }
    },
    putIndex: function (text) { put('ix', text); },
    page: function (stamp, name) { return stamp ? get('p:' + stamp + ':' + name) : null; },
    putPage: function (stamp, name, text) {
      if (!stamp) return;
      put('p:' + stamp + ':' + name, text);

<script>

window.PM = window.PM || {};
PM.fmt = (function () {
  'use strict';
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function scaleOf(unit) {
    var s = unit && Number(unit.scale);
    return (s && isFinite(s) && s > 0) ? s : 1;
  }

  function mark(unit) {
    var cur = (unit && unit.currency) || 'USD';
    return cur === 'CAD' ? 'C$' : (cur === 'EUR' ? '€' : (cur === 'GBP' ? '£' : '$'));
  }
  function money(value, unit, opts) {
    if (value == null || !isFinite(value)) return '—';
    var v = value * scaleOf(unit);
    var sign = v < 0 ? '-' : '';
    var a = Math.abs(v), out;
    if (a >= 1e9) out = (a / 1e9).toFixed(2) + 'B';
    else if (a >= 1e6) out = (a / 1e6).toFixed(2) + 'M';
    else if (a >= 1e3) out = (a / 1e3).toFixed(0) + 'K';
    else out = a.toFixed(0);
    return sign + mark(unit) + out +
      ((opts && opts.cur) ? ' ' + ((unit && unit.currency) || 'USD') : '');
  }
  function full(value, unit) {
    if (value == null || !isFinite(value)) return '—';
    var v = value * scaleOf(unit);
    return (v < 0 ? '-' : '') + mark(unit) +
      Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }
  function pct(value, digits) {
    if (value == null || !isFinite(value)) return '—';
    return (value * 100).toFixed(digits == null ? 1 : digits) + '%';
  }
  function signedPct(value) {
    if (value == null || !isFinite(value)) return '—';
    return (value > 0 ? '+' : '') + (value * 100).toFixed(1) + '%';
  }
  function ratio(value) {
    if (value == null || !isFinite(value)) return '—';
    return value.toFixed(2) + 'x';
  }
  function num(value, digits) {
    if (value == null || !isFinite(value)) return '—';
    return value.toLocaleString('en-US', { maximumFractionDigits: digits == null ? 2 : digits });
  }
  function month(iso) {
    if (!iso) return '—';
    var m = String(iso).match(/^(\d{4})-(\d{2})/);
    if (!m) return String(iso);
    var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return names[parseInt(m[2], 10) - 1] + ' ' + m[1];
  }

  var LONG = ['January', 'February', 'March', 'April', 'May', 'June',
              'July', 'August', 'September', 'October', 'November', 'December'];
  function monthName(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})/);
    return m ? LONG[parseInt(m[2], 10) - 1] : '';
  }
  function monthLong(iso) {
    var m = String(iso || '').match(/^(\d{4})-(\d{2})/);
    return m ? LONG[parseInt(m[2], 10) - 1] + ' ' + m[1] : month(iso);
  }

  function writeup(iso, withYear) {
    var name = withYear ? monthLong(iso) : monthName(iso);
    return name ? name + ' write-up' : 'The write-up';
  }

  function covValue(value, row, unit) {
    if (value == null || !isFinite(value)) return '—';
    var p = row && row.primitive;

  function name(s) { return esc(s).replace(/ -- /g, ' — '); }
  return { esc: esc, name: name, money: money, full: full, pct: pct, signedPct: signedPct,

           covValue: covValue, scaleOf: scaleOf };
})();

<script>

(function () {
  'use strict';
  var el = document.createElement('div');
  el.id = 'tip';
  el.setAttribute('role', 'tooltip');
  document.body.appendChild(el);
  var cur = null;

  function show(t) {
    var text = t.getAttribute('data-tip');
    if (!text) return;
    if (cur) cur.removeAttribute('aria-describedby');
    cur = t;
    el.innerHTML = text;

    t.setAttribute('aria-describedby', 'tip');
    place(t);
  }
  function place(t) {

    if (t.isConnected === false) { off(); return; }
    el.removeAttribute('data-below');
    el.style.left = '0px'; el.style.top = '0px';         // measure at a known place
    var r = t.getBoundingClientRect(), b = el.getBoundingClientRect(), pad = 8;

    if (r.bottom < 0 || r.top > window.innerHeight) { off(); return; }
    var left = Math.round(r.left + r.width / 2 - b.width / 2);
    left = Math.max(pad, Math.min(left, window.innerWidth - b.width - pad));
    var top = Math.round(r.top - b.height - 9);

    if (top < pad) { top = Math.round(r.bottom + 9); el.setAttribute('data-below', ''); }
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.setProperty('--ax', Math.round(r.left + r.width / 2 - left) + 'px');
    el.setAttribute('data-open', '');
  }
  function off() {
    if (timer) { clearTimeout(timer); timer = null; }
    el.removeAttribute('data-open');
    if (cur) cur.removeAttribute('aria-describedby');
    cur = null;
  }


  var OPEN_WAIT = 350, timer = null;
  function later(t) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (el.hasAttribute('data-open')) { show(t); return; }
    timer = setTimeout(function () { timer = null; show(t); }, OPEN_WAIT);
  }
  function stop() { if (timer) { clearTimeout(timer); timer = null; } }

  document.addEventListener('pointerover', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!t) { stop(); if (cur) off(); return; }
    if (t !== cur) later(t);
  });

  document.addEventListener('pointerdown', off, true);
  document.addEventListener('focusin', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if (t) show(t); else if (cur) off();
  });
  document.addEventListener('focusout', off);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') off(); });

  document.documentElement.addEventListener('mouseleave', off);

  window.PM = window.PM || {};
  window.PM.tip = { off: off, show: show };

  window.addEventListener('scroll', function () { if (cur) place(cur); },
                          { capture: true, passive: true });
})();
</script>

<script>

window.PM = window.PM || {};
PM.views = PM.views || {};
(function () {
  'use strict';
  var F = PM.fmt;

  var TABS = [
    { id: 'memo', label: 'Memo' },
    { id: 'covenants', label: 'Covenant tests' },
    { id: 'model', label: 'Financial model', excel: true },
  ];


  function picker(row, ix, tab) {
    var rows = (ix && ix.borrowers) || [];
    if (rows.length < 2) return '';
    var at = rows.map(function (r) { return r.slug; }).indexOf(row.slug);
    var prev = rows[at - 1], next = rows[at + 1];

    function to(r) {
      return '#/deal/' + encodeURIComponent(r.slug) + (tab && tab !== 'memo' ? '/' + tab : '');
    }
    function step(target, glyph, where) {
      if (!target) {
        return '<span class="step" aria-disabled="true" aria-hidden="true">' + glyph + '</span>';
      }
      return '<a class="step" href="' + to(target) + '" data-nav="' + to(target) +
        '" aria-label="' + where + ' borrower: ' + F.esc(target.short) +
        '" title="' + where + ': ' + F.esc(target.short) + '">' + glyph + '</a>';
    }
    var list = rows.map(function (r) {
      var cov = r.covenants || {}, counts = cov.counts;
      var cls = !r.readable ? '' : (counts && counts.breach ? ' bad'
        : (counts && counts.at_risk ? ' warn' : ''));
      var said = r.readable ? PM.views.covText(counts) : 'no results this month';
      return '<a href="' + to(r) + '" data-nav="' + to(r) + '"' +
        (r.slug === row.slug ? ' aria-current="page"' : '') +
        '><span class="nm">' + F.esc(r.short) + '</span>' +
        '<span class="st' + cls + '">' + F.esc(said) + '</span></a>';
    }).join('');
    return '<div class="dealnav">' + step(prev, '‹', 'Previous') +
      '<details class="picker"><summary aria-label="Choose a borrower — ' + (at + 1) +
      ' of ' + rows.length + '">' + (at + 1) + ' of ' + rows.length +
      ' <span aria-hidden="true">▾</span></summary>' +
      '<div class="panel">' + list + '</div></details>' +
      step(next, '›', 'Next') + '</div>';
  }

  function versionHref(row, tab, version) {
    return '#/deal/' + F.esc(row.slug) + '/' + tab + (version ? '?v=' + F.esc(version) : '');
  }

  function withFiles(row, files) {
    var copy = {}, key;
    for (key in row) {
      if (Object.prototype.hasOwnProperty.call(row, key)) copy[key] = row[key];
    }
    copy.files = files;
    return copy;
  }

  // Resolves a requested version against this borrower's own draft/history --
  // an unknown or no-longer-available version fails closed to the accepted
  // result rather than showing something unverified.
  function resolveVersion(row, version) {
    if (version === 'draft') {
      if (row.draft && row.draft.files) {
        return { row: withFiles(row, row.draft.files), version: 'draft',
                 label: 'the draft for ' + F.month(row.draft.period) + ' -- not yet accepted' };
      }
      return { row: row, version: null, label: null };
    }
    if (version) {
      var hist = (row.history || []).filter(function (h) { return h.period === version; })[0];
      if (hist && hist.files) {
        return { row: withFiles(row, hist.files), version: version,
                 label: F.month(hist.period) + ' (an earlier accepted period)' };
      }
    }
    return { row: row, version: null, label: null };
  }

  function head(row, ix, tab, version, versionLabel) {
    var view = row.our_view || {}, pills = [];

    if (view.watchlist && String(view.watchlist).toLowerCase() !== 'off') {
      pills.push('<span class="chip warn">watchlist: ' + F.esc(view.watchlist) + '</span>');
    }
    if (view.trajectory) pills.push('<span class="chip flat">' + F.esc(view.trajectory) + '</span>');
    pills.push('<span class="chip flat">' + F.esc(F.month(row.period)) + '</span>');

    var files = row.files || {};
    var links = [];
    if (files.excel_url) {
      links.push('<a class="xlbtn" href="' + F.esc(files.excel_url) + '" target="_blank" rel="noopener">' +
        PM.xlIcon() + 'Open the model in Excel</a>');
    }
    if (files.memo_url) {
      links.push('<a class="btn" href="' + F.esc(files.memo_url) + '" target="_blank" rel="noopener">Open the memo file</a>');
    }

    // A draft is a separately labelled preview, never the accepted result --
    // it opens through the same internal reader as the accepted deal, reading
    // only the draft's own files, next to (not instead of) the accepted
    // memo/model links above.
    var draft = row.draft, draftFiles = (draft && draft.files) || {};
    if (draft && draftFiles.memo) {
      var draftHref = versionHref(row, tab, 'draft');
      links.push('<a class="btn" data-verlink="draft" data-nav="' + draftHref + '" href="' + draftHref + '">' +
        'Preview draft for ' + F.esc(F.month(draft.period)) + ' (not yet accepted)</a>');
    }

    // Prior accepted periods, each opening through the same internal reader
    // against its own preserved files -- never the current one's file.
    var history = row.history || [];
    if (history.length) {
      var priorLinks = history.map(function (h) {
        var memo = (h.files || {}).memo;
        var histHref = versionHref(row, tab, h.period);
        return memo
          ? '<a data-verlink="' + F.esc(h.period) + '" data-nav="' + histHref + '" href="' + histHref + '">' +
            F.esc(F.month(h.period)) + '</a>'
          : F.esc(F.month(h.period));
      }).join(', ');
      links.push('<span class="chip flat">Prior periods: ' + priorLinks + '</span>');
    }

    var banner = '';
    if (version) {
      var returnHref = '#/deal/' + F.esc(row.slug) + '/' + tab;
      banner = '<div class="note">Now viewing ' + F.esc(versionLabel) + '. ' +
        '<a data-verlink="return" data-nav="' + returnHref + '" href="' + returnHref + '">' +
        'Return to the accepted result</a></div>';
    }

    return '<div class="deal-head"><div class="idrow">' +
      '<h2 id="viewtop" tabindex="-1" title="' + F.esc(row.name) + '">' + F.esc(row.short) + '</h2>' +
      '<div class="pills">' + pills.join(' ') + '</div>' +
      '<div class="spacer"></div>' +
      picker(row, ix, tab) +
      (links.length ? '<div class="acts">' + links.join(' ') + '</div>' : '') +
      '</div>' + banner + '</div>';
  }


  function tabBar(row, active, version) {
    return '<nav class="tabs" aria-label="This deal">' + TABS.map(function (t) {
      var to = versionHref(row, t.id, version);
      return '<a href="' + to + '" data-nav="' + to + '"' +
        (t.id === active ? ' aria-current="page"' : '') + '>' +
        (t.excel ? PM.xlIcon() : '') + F.esc(t.label) + '</a>';
    }).join('') + '</nav>';
  }


  var LINK_SHIM = '<script>(function(){' +
    'document.addEventListener("click",function(e){' +
      'var a=e.target&&e.target.closest?e.target.closest("a[href]"):null; if(!a) return;' +
      'var href=a.getAttribute("href")||"";' +

      'if(href.charAt(0)!=="#"){' +
        'if(!/^(https?:|mailto:)/i.test(href)){e.preventDefault();return;}' +
        'a.target="_blank"; a.rel="noopener noreferrer";' +
        'return; }' +
      // the memo's own handler has already opened the tab holding the target
      'e.preventDefault();' +
      'var id=href.slice(1); if(!id) return;' +
      'var soft=(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)' +
        '?"auto":"smooth";' +
      'if(id.indexOf("tab=")===0){ if(window.showTab) window.showTab(id.slice(4));' +
        ' window.scrollTo({top:0,behavior:soft}); return; }' +
      'var t=document.getElementById(id)||document.getElementsByName(id)[0];' +
      'if(t&&t.scrollIntoView) t.scrollIntoView({behavior:soft,block:"start"});' +
    '},false);' +
  '})();<\/script>';


  function safeOutbound(href) {
    var value = String(href || '').trim();
    return /^(https?:|mailto:)/i.test(value) ? value : '';
  }

  function openOut(href) {
    href = safeOutbound(href);
    if (!href) return;
    var win = null;

    try { win = window.open(href, '_blank'); } catch (e) { win = null; }
    if (win) { try { win.opener = null; } catch (e2) {} return; }
    var a = document.createElement('a');
    a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.position = 'fixed'; a.style.left = '-9999px';
    document.body.appendChild(a); a.click(); a.remove();
  }

  function linksOut(frame) {
    var doc = null;
    try { doc = frame.contentDocument; } catch (e) { doc = null; }
    if (!doc) return;                    // the shim marks the anchors instead
    doc.addEventListener('click', function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (href.charAt(0) === '#') return;              // the shim scrolls the memo
      var outbound = safeOutbound(a.href || href);
      e.preventDefault();
      if (outbound) openOut(outbound);
    }, true);
    linkCover(frame, doc);
  }


  function linkCover(frame, doc) {
    var wrap = frame.parentNode;
    if (!wrap) return;
    var cover = wrap.querySelector('a.memo-open');
    if (!cover) {
      cover = document.createElement('a');
      cover.className = 'memo-open';
      cover.target = '_blank';
      cover.rel = 'noopener noreferrer';
      wrap.appendChild(cover);

      cover.addEventListener('mouseleave', function () { cover.style.display = 'none'; });
    }
    function hide() { cover.style.display = 'none'; }

    function lineAt(a, x, y) {
      var rects = a.getClientRects ? a.getClientRects() : null;
      if (!rects || rects.length < 2) return a.getBoundingClientRect();
      for (var i = 0; i < rects.length; i++) {
        var r = rects[i];
        if (x >= r.left - 1 && x <= r.right + 1 && y >= r.top - 1 && y <= r.bottom + 1) {
          return r;
        }
      }
      return a.getBoundingClientRect();
    }
    function show(a, x, y) {
      var outbound = safeOutbound(a.href);
      if (!outbound) { hide(); return; }
      var r = lineAt(a, x, y);
      if (!r.width || !r.height) { hide(); return; }
      var f = frame.getBoundingClientRect(), w = wrap.getBoundingClientRect();
      cover.href = outbound;
      cover.title = a.textContent ? a.textContent.replace(/\s+/g, ' ').trim() : '';

      cover.style.left = (f.left - w.left - (wrap.clientLeft || 0) + r.left) + 'px';
      cover.style.top = (f.top - w.top - (wrap.clientTop || 0) + r.top) + 'px';
      cover.style.width = r.width + 'px';
      cover.style.height = r.height + 'px';
      cover.style.display = 'block';
    }
    doc.addEventListener('mousemove', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      var href = a ? (a.getAttribute('href') || '') : '';
      if (!a || href.charAt(0) === '#' || !safeOutbound(a.href || href)) { hide(); return; }
      show(a, e.clientX, e.clientY);
    });

    doc.addEventListener('scroll', hide, true);
    window.addEventListener('scroll', hide, true);
    window.addEventListener('resize', hide);
  }

  function withShim(html) {
    var text = String(html);
    var at = text.lastIndexOf('</body>');
    return at < 0 ? text + LINK_SHIM : text.slice(0, at) + LINK_SHIM + text.slice(at);
  }

  function memoTab(host, row) {
    var files = row.files || {};
    if (!files.memo) {
      host.innerHTML = '<div class="empty">No memo was built for this month.</div>';
      return;
    }
    host.innerHTML = '<div class="sk-doc"><div class="sk head"></div><div class="sk"></div>' +
      '<div class="sk"></div><div class="sk short"></div><div class="sk block"></div></div>';
    PM.data.memo(files.memo).then(function (html) {
      if (!host.isConnected) return;                     // the reader moved on
      host.innerHTML = '<div class="memo-wrap pane"><div class="memo-doc"></div></div>';
      var frame = document.createElement('iframe');
      frame.className = 'memo-frame';
      frame.setAttribute('title', 'Monthly monitoring memo');
      frame.setAttribute('referrerpolicy', 'no-referrer');
      frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox');
      host.querySelector('.memo-doc').appendChild(frame);
      function size() {
        try {
          var top = frame.getBoundingClientRect().top;
          frame.style.height = Math.max(520, (window.innerHeight || 0) - top - 30) + 'px';
        } catch (e) {}
      }

      frame.addEventListener('load', function () {
        size(); frame.classList.add('ready'); linksOut(frame);
      });
      frame.srcdoc = withShim(html);
      size();
      window.addEventListener('resize', function () { if (frame.isConnected) size(); });
    }, function () {
      if (!host.isConnected) return;
      host.innerHTML = '<div class="empty">The memo could not be opened just now. ' +
        'That usually means the folder is still syncing — try again in a minute.</div>';
    });
  }


  function traceButton(row, ref, version) {
    if (!ref || !ref.sheet) return '';
    var label = ref.sheet + (ref.cells ? ' ' + ref.cells : '');
    return '<button class="tracelink" data-trace="' + F.esc(row.slug) + '|' +
      F.esc(ref.sheet) + '|' + F.esc(ref.cells || '') + '|' + F.esc(version || '') + '">' + PM.xlIcon() +
      'in the model: ' + F.esc(label) + '</button>';
  }


  function pairNote(c, byId) {
    if (c.group_members && c.group_members.length) {
      var legs = c.group_members.map(function (id) {
        return F.name((byId[id] && byId[id].name) || id);
      }).join(' or ');
      return '<div class="pair">Either/or — the borrower satisfies this by passing ' +
        legs + '. The rows below are those tests.</div>';
    }
    if (!c.either_or_group) return '';
    var pair = byId[c.either_or_group];
    var name = F.name((pair && pair.name) || c.either_or_group);
    var held = c.group_status === 'pass'
      ? ' The pair passes, on the other test.'
      : (c.group_status ? ' The pair itself is ' + F.esc(c.group_status) + '.' : '');
    return '<div class="pair">One of two ways to satisfy ' + name + '.' + held + '</div>';
  }

  function covRow(c, row, sharedDate, byId, version) {
    var cls = c.status === 'breach' ? 'bad'
      : (c.status === 'at_risk' ? 'warn' : (c.status === 'pass' ? 'ok' : 'flat'));
    var label = { pass: 'pass', breach: 'breach', at_risk: 'at risk',
                  not_evaluable: 'not testable' }[c.status] || c.status || '—';
    var modelRef = (c.source_ref || []).filter(function (r) { return r && r.sheet; })[0];

    var cert = '';
    if (c.cert_value != null) {
      var said = 'Their certificate says ' + F.esc(F.covValue(c.cert_value, c, row.unit));
      if (c.cert_agrees === true) {
        cert = '<div class="cert">' + said + ' — this agrees with our figure.</div>';
      } else if (c.cert_agrees === false) {
        cert = '<div class="cert off">' + said +
          ' — <strong>that does not match our figure</strong>.</div>';
      } else {
        cert = '<div class="cert">' + said + ' — ' + (c.actual == null
          ? 'we have no figure of our own this month to compare it with.'
          : 'this was not checked against our figure.') + '</div>';
      }
    }
    var calc = c.calc || c.source || '';
    var how = calc ? '<details class="howto"><summary>How this was worked out</summary>' +
      '<div class="calc">' + F.esc(calc) + '</div></details>' : '';

    var pair = pairNote(c, byId || {});
    var bare = (c.required == null && c.actual == null && !pair)
      ? '<div class="cert none">No figures were published for this row.</div>' : '';
    return '<tr' + (c.either_or_group && !c.group_members ? ' class="leg"' : '') +
      '><td><strong>' + F.name(c.name || c.id || '') + '</strong>' + pair + bare + cert + how +
      (modelRef ? '<div>' + traceButton(row, modelRef, version) + '</div>' : '') + '</td>' +
      '<td><span class="chip flat sm">' + F.esc(c.basis) + '</span>' +
        (c.test_date && c.test_date !== sharedDate
          ? '<div class="calc odd">tested ' + F.esc(c.test_date) + '</div>' : '') + '</td>' +
      '<td class="num tnum">' + F.esc(F.covValue(c.required, c, row.unit)) + '</td>' +
      '<td class="num tnum">' + F.esc(F.covValue(c.actual, c, row.unit)) + '</td>' +
      '<td class="num tnum">' + (c.headroom_pct == null ? '—' : F.signedPct(c.headroom_pct)) + '</td>' +
      '<td><span class="chip ' + cls + '">' + F.esc(label) + '</span></td></tr>';
  }


  function covenantsTab(host, row, version) {
    var files = row.files || {};
    if (!files.deal) { host.innerHTML = '<div class="empty">No covenant results for this month.</div>'; return; }
    host.innerHTML = '<div class="sk-doc"><div class="sk head"></div><div class="sk"></div>' +
      '<div class="sk short"></div><div class="sk"></div><div class="sk short"></div></div>';
    PM.data.page(files.deal).then(function (deal) {
      if (!host.isConnected) return;
      var cov = deal.covenants || {};
      var rows = cov.latest || [];
      if (!rows.length) {
        host.innerHTML = '<div class="empty">This borrower has no covenant test this month.</div>';
        return;
      }

      var notes = (cov.transcription_notes || []).map(function (n) {
        return '<div class="note">' + F.esc(typeof n === 'string' ? n : (n.note || JSON.stringify(n))) + '</div>';
      }).join('');
      var asOf = (cov.summary && cov.summary.as_of) || '';
      var byId = {};
      rows.forEach(function (c) { if (c.id) byId[c.id] = c; });
      host.innerHTML = '<div class="body pane">' +
        (asOf ? '<p class="tested">Tested as at ' + F.esc(asOf) +
          '. A test on another date says so on its own row.</p>' : '') +


        '<table class="cov"><thead><tr>' +
        '<th tabindex="0" data-tip="The promise, as the credit agreement words it.">Covenant</th>' +
        '<th tabindex="0" data-tip="The stretch of time the test is run over, and the date ' +
          'it is run as at.">Basis</th>' +
        '<th class="num" tabindex="0" data-tip="The level the agreement requires this ' +
          'month.">Required</th>' +
        '<th class="num" tabindex="0" data-tip="What we make the borrower&#39;s own figure, ' +
          'worked out from its reporting package.">Actual</th>' +
        '<th class="num" tabindex="0" data-tip="How far <b>Actual</b> is from <b>Required</b>. ' +
          'Room to spare where it is positive, a shortfall where it is negative.">Headroom</th>' +
        '<th tabindex="0" data-tip="Whether the promise was kept this month.">Result</th>' +
        '</tr></thead><tbody>' +
        rows.map(function (c) { return covRow(c, row, asOf, byId, version); }).join('') +
        '</tbody></table>' +
        (notes ? '<div class="covnotes"><b>Reading notes on the compliance ' +
          'certificate</b>' + notes + '</div>' : '') +
        ((cov.agreement_ref || cov.methodology)
          ? '<details class="disclose"><summary>How these tests were set up</summary><div class="pane">' +
            '<div class="readpanel">' +
            (cov.agreement_ref ? '<p>Tested against ' + F.esc(cov.agreement_ref) + '</p>' : '') +
            (cov.methodology ? '<p>' + F.esc(cov.methodology) + '</p>' : '') +
            '</div></div></details>'
          : '') +
        '</div>';
    }, function () {
      if (!host.isConnected) return;
      host.innerHTML = '<div class="empty">The covenant results could not be read just now.</div>';
    });
  }


  function modelTab(host, row, sheetName, cellRef, version) {
    var files = row.files || {};
    if (!files.workbook) {
      host.innerHTML = '<div class="empty">The financial model was not built into the book this month.' +
        (files.excel_url ? ' <a class="xlbtn" href="' + F.esc(files.excel_url) +
          '" target="_blank" rel="noopener">' + PM.xlIcon() + 'Open it in Excel</a>' : '') + '</div>';
      return;
    }
    host.innerHTML = '<div class="sk-doc"><div class="sk head"></div><div class="sk block"></div></div>';
    PM.data.page(files.workbook).then(function (wb) {
      if (!host.isConnected) return;
      PM.views.workbook(host, wb, row, sheetName, cellRef, version);
    }, function () {
      if (!host.isConnected) return;
      host.innerHTML = '<div class="empty">The model could not be read just now.</div>';
    });
  }


  function body(host, row, tab, sheet, cell, version) {
    if (tab === 'memo') memoTab(host, row);
    else if (tab === 'covenants') covenantsTab(host, row, version);
    else modelTab(host, row, sheet, cell, version);
  }

  PM.views.deal = function (slug, tab, sheet, cell, version) {
    tab = TABS.some(function (t) { return t.id === tab; }) ? tab : 'memo';
    var app = document.getElementById('app');
    var token = PM.router.fresh(), at = PM.router.at();
    var open = app.querySelector('.card[data-deal="' + slug.replace(/"/g, '') + '"]');
    if (open && (open.getAttribute('data-version') || '') === (version || '')) {
      open.setAttribute('data-tab', tab);
      open.querySelectorAll('.tabs a').forEach(function (link) {
        if ((link.getAttribute('data-nav') || '').split('?')[0].split('/').pop() === tab) {
          link.setAttribute('aria-current', 'page');
        } else { link.removeAttribute('aria-current'); }
      });
      // the draft/history/return links in the header stay out of the fast
      // path above, so each must be re-pointed at the tab now on screen,
      // keeping whichever version query (if any) it already carried
      open.querySelectorAll('.deal-head [data-verlink]').forEach(function (link) {
        var nav = link.getAttribute('data-nav') || '';
        var mark = nav.indexOf('?');
        var next = '#/deal/' + slug + '/' + tab + (mark >= 0 ? nav.slice(mark) : '');
        link.setAttribute('href', next);
        link.setAttribute('data-nav', next);
      });
      // the index is already in memory, so this settles in a microtask
      PM.data.row(slug).then(function (row) {
        if (PM.router.stale(token)) return;
        var active = resolveVersion(row, version);
        body(open.querySelector('#dealbody'), active.row, tab, sheet, cell, active.version);
        PM.boot.landed(at);
      }, function (e) { if (!PM.router.stale(token)) PM.boot.viewError(e); });
      return;
    }
    app.innerHTML = '<div class="card"><div class="sk-doc"><div class="sk head"></div>' +
      '<div class="sk"></div><div class="sk short"></div><div class="sk block"></div></div></div>';
    Promise.all([PM.data.row(slug), PM.data.index()]).then(function (both) {
      if (PM.router.stale(token)) return;
      var row = both[0], ix = both[1];
      var active = resolveVersion(row, version);
      app.innerHTML = '<div class="card" data-deal="' + F.esc(row.slug) + '" data-tab="' +
        F.esc(tab) + '" data-version="' + F.esc(active.version || '') + '">' +
        head(active.row, ix, tab, active.version, active.label) + tabBar(active.row, tab, active.version) +
        '<div id="dealbody"></div></div>';
      body(document.getElementById('dealbody'), active.row, tab, sheet, cell, active.version);
      PM.boot.landed(at);
    }, function (e) { if (!PM.router.stale(token)) PM.boot.viewError(e); });
  };


  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.picker[open]').forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var open = document.querySelector('details.picker[open]');
    if (open) { open.removeAttribute('open'); var s = open.querySelector('summary'); if (s) s.focus(); }
  });




  document.addEventListener('click', function (e) {
    var btn = e.target && e.target.closest ? e.target.closest('[data-trace]') : null;
    if (!btn) return;
    var parts = btn.getAttribute('data-trace').split('|');
    var query = parts[3] ? '?v=' + encodeURIComponent(parts[3]) : '';
    PM.router.go('#/deal/' + encodeURIComponent(parts[0]) + '/model/' +
      encodeURIComponent(parts[1]) + (parts[2] ? '/' + encodeURIComponent(parts[2]) : '') + query);
  });
})();
