    <linearGradient id="band" x1="0" y1="0" x2="0.5" y2="0.87">
      <stop offset="0" stop-color="#100830"/>
      <stop offset="0.55" stop-color="#170B41"/>
      <stop offset="1" stop-color="#231363"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#band)"/>
  <text x="60" y="66" fill="#B9AFCE" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">CREDIT MONITORING</text>
  <text x="60" y="112" fill="#FAF6F5" font-family="Arial,sans-serif" font-size="38" font-weight="700">Evidence to review-ready monitoring</text>

