<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic monitoring memo and portfolio dashboard</title>
  <desc id="desc">A fictional Nemeris Field Systems memo beside a portfolio dashboard for three synthetic borrowers.</desc>
  <defs>
