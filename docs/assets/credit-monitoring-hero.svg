      <text x="24" y="28" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#222222">Veyrona Decision Systems</text>
      <text x="24" y="49" font-family="Arial,sans-serif" font-size="13" fill="#5C5C5C">May 2026 · current</text>
