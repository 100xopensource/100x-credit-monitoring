name: Feature request
description: Suggest an improvement to Credit Monitoring
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Do not include borrower, client, or other confidential information. Describe the workflow using synthetic examples.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or monitoring problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful result, not a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This request contains no confidential information.
          required: true
