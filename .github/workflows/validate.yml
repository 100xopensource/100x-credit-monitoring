name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep maintainer-only files out of the public repository
        if: github.repository == '100xopensource/100x-credit-monitoring'
        run: |
          found=0
          for p in STAGING_SYNC.md .staging .github/workflows/port-to-production.yml .github/workflows/sync-from-production.yml .github/workflows/port-from-shared-dev.yml .github/workflows/test-run.yml .github/workflows/demo-refresh.yml; do
            if [ -e "$p" ]; then
              echo "::error file=$p::$p is a maintainer-only file and must not be published here."
              found=1
            fi
          done
          exit $found
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q plugins/credit-monitoring tools
      - run: python tools/package.py check
