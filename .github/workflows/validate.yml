name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep maintainer-only files out of the public repository
        if: github.repository == '100xopensource/100x-credit-monitoring'
        run: |
          if [ -e STAGING_SYNC.md ]; then
            echo "::error file=STAGING_SYNC.md::STAGING_SYNC.md is a maintainer-only file and must not be published here."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q plugins/credit-monitoring tools
      - run: python tools/package.py check
